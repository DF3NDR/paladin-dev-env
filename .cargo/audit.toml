# cargo-audit configuration
# See: https://docs.rs/cargo-audit/latest/cargo_audit/
#
# `SECURITY-EXCEPTIONS.md` (repo root) is the authoritative GOVERNANCE record
# for every entry below — owner, review date, affected scope and compensating
# control. This file is the mechanical suppression surface `cargo-audit`
# reads; `scripts/check-advisory-register.sh` enforces that it stays in sync
# with the register and with `deny.toml`'s mirrored vulnerability class (see
# ADR-0024).

[advisories]
# RUSTSEC-2023-0071: RSA timing side-channel via rsa 0.9.x
#   rsa is a transitive dep of sqlx-mysql (dev/test dependency).
#   No fixed version is available upstream; revisit when sqlx upgrades rsa.
#
# RUSTSEC-2025-0111: tokio-tar path-traversal via tokio-tar 0.3.x
#   tokio-tar is a transitive dep of testcontainers (dev/test dependency only).
#   No fixed version is available upstream; revisit when testcontainers upgrades.
#
# --- New 2026 advisories in transitive deps of optional features (no upstream fix) ---
# These are DoS-class advisories in third-party crates pulled only by optional features
# (content ingestion, S3 storage); our first-party code does not feed them untrusted input
# in default builds. The directly-fixable ones (RUSTSEC-2026-0185 quinn-proto,
# RUSTSEC-2026-0190 anyhow) were upgraded instead of ignored.
#
# RUSTSEC-2026-0187: stack overflow in lopdf via deeply nested PDF objects.
#   lopdf is transitive via `pdf-extract`, an unconditional dependency of `paladin-content`;
#   reachability is gated one level up, by whether the facade's optional `paladin-content`
#   dependency is enabled (see ADR-0032). The fix requires `pdf-extract` >= 0.12 (a breaking
#   jump that also pulls a fresh `ttf-parser` advisory); deferred. Revisit when `pdf-extract`
#   ships lopdf >= 0.42 without new advisories.
#
# RUSTSEC-2026-0194 / -0195: quick-xml quadratic attribute parsing / unbounded namespace
#   allocation (DoS). The remaining < 0.41 instance is transitive via `rust-s3`/`aws-creds`
#   (optional `s3`); no `rust-s3` release uses quick-xml >= 0.41 yet. The `rss`/`atom_syndication`
#   path was upgraded to quick-xml 0.41. Revisit when `rust-s3` bumps quick-xml.
#
# RUSTSEC-2026-0367 / -0368 / -0369 / -0429: zip 3.0.0 extraction advisories (SUID/SGID bits,
#   symlink targets outside the destination, permissions applied through symlinks, abort on a
#   symlink entry with a large declared size). zip is a build-dependency of `utoipa-swagger-ui`
#   (paladin-web, `vendored` feature) only: its build script unpacks the crate's own embedded
#   Swagger UI bundle, never calls the affected `extract` APIs, and zip is linked into no shipped
#   binary. utoipa-swagger-ui 10.0.2 reaches zip ^9.0 but requires utoipa ^6.0.0 (checked
#   2026-11-04), so the lift is the utoipa 6 migration. Revisit when that lands in a minor release.
#
# --- Added 2026-11-20: fixes are version migrations owned by the v0.12.0 milestone ---
# Governance (scope, compensating control, review date) is in SECURITY-EXCEPTIONS.md.
#
# RUSTSEC-2026-0457: rmcp 2.1.0 OAuth client SSRF filter. rmcp's `auth` feature is not enabled
#   anywhere in the workspace, so the OAuth client is not compiled. Fixed by rmcp >= 3.7.0.
#
# RUSTSEC-2026-0462: rmcp 2.1.0 unbounded response body buffering in the Streamable HTTP client.
#   LIVE EXPOSURE with a partial control only: a malicious or compromised operator-configured
#   remote MCP server can exhaust the process's memory. Fixed by rmcp >= 3.9.0.
#
# RUSTSEC-2026-0459: libsqlite3-sys 0.30.1 bundles SQLite < 3.54.0 (uninitialized memory via a
#   crafted database/-wal pair, local vector). sqlx-sqlite 0.8.x caps libsqlite3-sys at ^0.30.1;
#   fixed by sqlx 0.9.x with libsqlite3-sys >= 0.39.0.
#
# RUSTSEC-2026-0545 / -0548: zip 3.0.0 (AES authentication code not checked; ZipStreamReader
#   local-header names). Same build-dependency of utoipa-swagger-ui as the four zip rows above:
#   `aes-crypto` is off and the build script never uses ZipStreamReader. Fixed by the utoipa 6
#   migration (zip >= 9.0.5).
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2025-0111",
    "RUSTSEC-2026-0187",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0457",
    "RUSTSEC-2026-0462",
    "RUSTSEC-2026-0459",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
]
