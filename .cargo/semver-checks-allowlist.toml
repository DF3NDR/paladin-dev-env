# cargo-semver-checks per-item deliberate-breaking allowlist (X-10.5, D-06).
#
# Source of truth: `MIGRATION.md` §9.2 ("Rust API changes"). This file is the
# machine-checked mirror of that table's rows marked `Deliberate-breaking? = Y`
# -- NOT a config the `cargo semver-checks` CLI reads directly. The `semver`
# CI job in `.github/workflows/ci.yml` runs a set-equality check between this
# file's `[[entry]]` list and MIGRATION.md §9.2's deliberate-breaking rows, in
# both directions: every entry here must have a matching §9.2 row, and every
# §9.2 row marked `Y` must have a matching entry here. Neither direction may
# be satisfied by a blanket wildcard -- every entry names one crate and one
# specific lint.
#
# When a change genuinely needs to ship as deliberate-breaking (X-10.6, the
# v0.10.0 minor bump's one sanctioned use of semver-breaking permission), the
# actual suppression at the `cargo semver-checks` tool level is applied via
# that crate's own `Cargo.toml` under `[package.metadata.cargo_semver_checks.lints]`
# (see the tool's lint-level configuration docs) -- this file is the review
# register that keeps that per-crate suppression traceable to a requirement,
# not the mechanism that silences the tool.
#
# EMPTY AS OF THIS PLAN (22-04): no pre-existing public type has been touched
# by Phase 22 as of Plan 22-01 (see MIGRATION.md's "Note on Plan 22-01").
# Every §9.2 row inherited from the program overview is still `TBD`, not `Y`,
# so this file correctly holds zero entries. A future plan in this phase (or
# a later phase, per §9.2's per-row owners) adds an `[[entry]]` here in the
# SAME commit that marks its MIGRATION.md row `Y`.
#
# Schema per entry:
#   crate           = "<published crates.io package name>"
#   lint            = "<cargo-semver-checks lint id being suppressed>"
#   migration_row   = "<the MIGRATION.md §9.2 Crate/Type row this mirrors>"
#   requirement_id  = "<owning requirement, e.g. FT-01>"
#   justification   = "<one line: why this is deliberate-breaking, not a mitigation>"
#
[[entry]]
crate = "paladin-web"
lint = "function_requires_different_generic_type_params"
migration_row = "paladin-web | require_authentication (fn)"
requirement_id = "HITL-FR-16"
justification = "require_authentication gained a generic type parameter (S: HasAgentAuth) so ThreadApiState's routes (24-11) can reuse the SAME middleware AgentApiState's routes already layer, instead of a duplicated copy -- accepted as the minimal, intentional cost of that reuse."

[[entry]]
crate = "paladin-ai-core"
lint = "enum_marked_non_exhaustive"
migration_row = "paladin-ai-core | BattalionError"
requirement_id = "FT-01"
justification = "BattalionError gained the Node(NodeError) variant (FT-FR-02, D-06) and is marked #[non_exhaustive] so the superstep engine's structured node-execution errors can be extended later without a semver-major bump."

[[entry]]
crate = "paladin-ai-core"
lint = "enum_marked_non_exhaustive"
migration_row = "paladin-ai-core | PaladinError"
requirement_id = "FT-01"
justification = "PaladinError gained the structured LlmFailure variant and the transience() method (D-02); marked #[non_exhaustive] so a typed-classification error taxonomy can grow without a semver-major bump. LlmFailure's Display is byte-identical to the legacy LlmError(String) arm and is_retryable() answers true exactly as that legacy arm did, so circuit_breaker.rs is unaffected (X-03, X-06)."

[[entry]]
crate = "paladin-ports"
lint = "enum_marked_non_exhaustive"
migration_row = "paladin-ports | LlmError"
requirement_id = "FT-01, FT-05"
justification = "LlmError gained ProviderError and AllProvidersFailed (status-carrying variants for the FT-05 fallback chain, D-03) and the transience() method; marked #[non_exhaustive] so the provider-error taxonomy can grow without a semver-major bump."

[[entry]]
crate = "paladin-ai-core"
lint = "constructible_struct_adds_field"
migration_row = "paladin-ai-core | PaladinResult"
requirement_id = "FT-FR-17"
justification = "PaladinResult gained the additive served_by: Option<String> field (serving provider from the FT-05 fallback chain, D-26) with #[serde(default, skip_serializing_if)] so legacy JSON is byte-identical; the struct stays constructible and is deliberately NOT #[non_exhaustive] because cross-crate functional-update syntax is disallowed on non_exhaustive structs -- FT-FR-17's premise that Default still works under that marking does not hold -- so only full struct literals break, and every in-tree one was migrated in the same commit."

[[entry]]
crate = "paladin-ports"
lint = "struct_marked_non_exhaustive"
migration_row = "paladin-ports | LlmRequest"
requirement_id = "RT-05"
justification = "LlmRequest has no Default, so no functional-update site exists to preserve; every downstream literal breaks under either X-10.3 option and only marking it #[non_exhaustive] (option a) makes the next field free."

[[entry]]
crate = "paladin-ai-core"
lint = "enum_marked_non_exhaustive"
migration_row = "paladin-ai-core | StopReason"
requirement_id = "RT-02"
justification = "StopReason gained CallLimit and TokenBudget (ModelCallLimit and TokenBudget middleware, D-08) and is marked #[non_exhaustive] so a future budget-triggered stop reason can be added without a semver-major bump. The X-10.2 exception overview section 3 names for this exact enum is deliberately declined: nothing in the tree or in examples/ relies on exhaustive matching over StopReason, and one mechanism across PaladinError/LlmError/BattalionError/StopReason beats a bespoke exception (D-07). Every in-tree exhaustive match gained a wildcard arm in the same commit."

[[entry]]
crate = "paladin-ai-core"
lint = "struct_marked_non_exhaustive"
migration_row = "paladin-ai-core | GarrisonEntry"
requirement_id = "RT-03"
justification = "GarrisonEntry gained a persisted is_summary: bool field (RT-FR-12, D-17) marking a Garrison entry as a compressed stand-in for older history; #[serde(default)] keeps every pre-existing JSON/SQLite row reading is_summary == false, and #[non_exhaustive] plus the four constructors (new/with_metadata/with_token_count/summary) make the next field free without breaking downstream struct literals."

[[entry]]
crate = "paladin-ai"
lint = "constructible_struct_adds_field"
migration_row = "paladin-ai | Settings"
requirement_id = "RT-02"
justification = "Settings gained the additive agent_runtime: AgentRuntimeConfig field (X-09, D-10) with #[serde(default)], so an absent agent_runtime: key resolves to a fully inert default and a v0.9 config boots with identical behavior. The struct stays constructible and is deliberately NOT #[non_exhaustive] for the same reason PaladinResult is not (D-26): Settings implements Default, and cross-crate functional-update syntax is disallowed on non_exhaustive structs, so marking it would break every ..Default::default() site downstream. Only full struct literals break, and every in-tree one was migrated with the field."

# --- Phase 31 (Lossless Token Accounting, ACCT-01..05) -----------------------
# Entries below were derived empirically per D-27: run `cargo semver-checks
# check-release --package <pkg> --default-features --baseline-version 0.9.0`
# and write only the lint ids the tool actually reported (see 31-07-SUMMARY.md
# for the captured output this plan recorded).

[[entry]]
crate = "paladin-ai-core"
lint = "inherent_method_missing"
migration_row = "paladin-ai-core | TokenUsage"
requirement_id = "ACCT-01"
justification = "TokenUsage::from_total was deleted outright (D-05) -- a constructor whose only purpose is to discard the prompt/completion split is the bug this phase exists to fix. Every in-tree caller migrated to TokenUsage::new(..) plus builders in the same commit; no #[deprecated] replacement was added."

[[entry]]
crate = "paladin-ai-core"
lint = "constructible_struct_adds_field"
migration_row = "paladin-ai-core | TokenUsage"
requirement_id = "ACCT-01"
justification = "TokenUsage gained three additive Option<u32> sub-count fields (cache_read_tokens, cache_write_tokens, reasoning_tokens), each #[serde(default)] (D-01). The struct stays constructible and is deliberately NOT #[non_exhaustive] (X-10.3 option (b), D-04) -- it derives Default, so marking it non_exhaustive would break every ..Default::default() site downstream. Only full struct literals break, and every in-tree one was migrated to TokenUsage::new(..) plus the new with_cache_read/with_cache_write/with_reasoning builders in the same commit."

[[entry]]
crate = "paladin-ai-core"
lint = "struct_pub_field_missing"
migration_row = "paladin-ai-core | PaladinResult"
requirement_id = "ACCT-02"
justification = "PaladinResult's bare token_count: u32 field was replaced by usage: TokenUsage (D-07, D-09) -- the full prompt/completion/cache/reasoning split, not a rename-preserving total. usage carries #[serde(default)] so a pre-phase document deserialises with usage == TokenUsage::default() (D-25). This ADDS to the existing constructible_struct_adds_field entry on this same crate/type pair (the row-level gate is deduplicated by crate | type, not by lint) rather than duplicating the row."

[[entry]]
crate = "paladin-ports"
lint = "struct_marked_non_exhaustive"
migration_row = "paladin-ports | StreamingResponse"
requirement_id = "ACCT-03"
justification = "StreamingResponse gained an additive usage: Option<TokenUsage> field (D-13) and is marked #[non_exhaustive]. The struct has no Default, so there is no functional-update site to preserve; marking it #[non_exhaustive] (X-10.3 option (a), the LlmRequest precedent already suppressed by this same lint id in this crate) makes the next field free. Every in-tree literal migrated to the new delta()/terminal()/with_usage() constructors in the same commit."

[[entry]]
crate = "paladin-ports"
lint = "struct_marked_non_exhaustive"
migration_row = "paladin-ports | ChunkMetadata"
requirement_id = "ACCT-03"
justification = "ChunkMetadata gained an additive usage: Option<TokenUsage> field, populated only on the is_final stream chunk (D-18), and is marked #[non_exhaustive]. The type derived no Default at the v0.9.0 baseline, which is what makes X-10.3 option (a) the correct choice here (resolving CONTEXT.md D-18's open question). Every in-tree literal migrated to the new new()/with_tokens/with_loop_count/with_usage constructors in the same commit."

[[entry]]
crate = "paladin-web"
lint = "constructible_struct_adds_field"
migration_row = "paladin-web | ExecuteResponse"
requirement_id = "ACCT-02, ACCT-05"
justification = "ExecuteResponse gained the usage: TokenUsageResponse field replacing the bare token_count (D-24) -- a new utoipa::ToSchema DTO converted through the one From<PaladinResult> conversion point. Leaving a bare token_count on the wire would re-create the collapse one layer up and force a second break after 1.0; openapi.json was regenerated via make openapi in the same commit."

[[entry]]
crate = "paladin-web"
lint = "struct_pub_field_missing"
migration_row = "paladin-web | ExecuteResponse"
requirement_id = "ACCT-02, ACCT-05"
justification = "ExecuteResponse's token_count field was removed, replaced by usage: TokenUsageResponse (D-24) -- a published HTTP response contract, one-way door confirmed at plan 31-01's consolidated checkpoint. This ADDS to the constructible_struct_adds_field entry above on the same crate/type pair rather than duplicating the row (the row-level gate is deduplicated by crate | type, not by lint)."

# --- Phase 32 (Unified Token Primitives, PRIM-01..05) -----------------------
# Entries below were derived empirically per D-14: cargo-semver-checks 0.50.0
# was run with --release-type minor (mandatory -- a 0.9.0 -> 0.10.0 bump is
# already-major-equivalent without it) for --default-features AND, separately,
# --features content-processing (the legacy pair sits behind that feature in
# both paladin-memory and the facade, invisible to CI's --default-features-only
# semver job). Only lint ids the tool actually reported are entered here --
# see 32-05-SUMMARY.md Task 1 for the six captured discovery runs. Notably,
# NO entry exists for paladin-llm | Commissary (D-08's constructor-arity break)
# or paladin-ports | TokenCounterPort (D-06/D-07's additive is_exact method):
# both fired zero lints across every recorded run (32-05-SUMMARY.md Runs 1-2,
# 6) -- confirmed, not guessed; see MIGRATION.md's note immediately following
# the CompletedRow row.

[[entry]]
crate = "paladin-memory"
lint = "trait_missing"
migration_row = "paladin-memory | TokenCounter"
requirement_id = "PRIM-03, PRIM-05"
justification = "The legacy fallible TokenCounter trait was removed outright with no #[deprecated] shim (D-09) -- zero in-tree callers existed outside its own definition file and the three re-export sites. content-processing-gated in both paladin-memory and the facade, so CI's semver job's --default-features-only invocation cannot observe this removal at all; this entry and its justification are the only record of that gap. Empirically confirmed via cargo semver-checks check-release --package paladin-memory --features content-processing --baseline-version 0.9.0 --release-type minor (trait_missing on all 3 re-export paths)."

[[entry]]
crate = "paladin-memory"
lint = "struct_missing"
migration_row = "paladin-memory | TokenCounterFactory"
requirement_id = "PRIM-03, PRIM-05"
justification = "The legacy TokenCounterFactory struct (for_model/supported_models/is_supported) was removed outright with no #[deprecated] shim (D-09) -- zero in-tree callers. content-processing-gated identically to TokenCounter above, so CI's semver job's --default-features-only invocation cannot observe this removal either; this entry and its justification are the only record of that gap. Empirically confirmed via cargo semver-checks check-release --package paladin-memory --features content-processing --baseline-version 0.9.0 --release-type minor (struct_missing on all 3 re-export paths)."

