# cargo-semver-checks per-item deliberate-breaking allowlist (X-10.5, D-06).
#
# Source of truth: `MIGRATION.md` §11.2 ("Rust API changes": the open v0.11.1
# register) and ONLY §11.2. The registers of §10.2 and §9.2 are frozen records of
# breaks already shipped against older baselines and are not read. This file is
# the machine-checked mirror of the §11.2 rows marked `Deliberate-breaking? = Y`
# -- NOT a config the `cargo semver-checks` CLI reads directly. The allowlist gate
# (`scripts/check-migration-allowlist.sh`, run by the required
# `License & Dependency Policy` job in `.github/workflows/ci.yml`) runs a
# set-equality check between this file's `[[entry]]` list and MIGRATION.md
# §11.2's deliberate-breaking rows, in both directions: every entry here must
# have a matching §11.2 row, and every §11.2 row marked `Y` must have a matching
# entry here. It also checks the crate-wide side: every lint a crate allows
# crate-wide in its own `[package.metadata.cargo-semver-checks.lints]` table must
# have an entry for that crate here, or the gate fails. Neither direction may be
# satisfied by a blanket wildcard -- every entry names one crate and one
# specific lint.
#
# EMPTY AS OF PHASE 52: the 85 former entries mirrored §9.2 and §10.2 breaks
# measured against the 0.9.0 and 0.10.1 baselines. The published 0.11.0 now
# contains those breaks, so the entries were retired together with the six
# crate-wide manifest tables (plan 52-05), after the gate was measured at
# --release-type patch against 0.11.0 with no table in force and every one of the
# twelve packages passed. A later phase that genuinely needs a deliberate break
# adds an `[[entry]]` here in the SAME commit as its MIGRATION.md §11.2 `Y` row.
#
# Schema per entry:
#   crate           = "<published crates.io package name>"
#   lint            = "<cargo-semver-checks lint id being suppressed>"
#   migration_row   = "<the MIGRATION.md §11.2 Crate/Type row this mirrors>"
#   requirement_id  = "<owning requirement, e.g. FT-01>"
#   justification   = "<one line: why this is deliberate-breaking, not a mitigation>"
#
