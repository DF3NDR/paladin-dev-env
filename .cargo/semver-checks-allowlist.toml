# `SERVED_MODEL_METADATA_KEY`, `FallbackStepConfig`, `ModelFallbackMiddleware::from_steps` and
# `paced_steps` fired nothing and have register-only `N` rows.

[[entry]]
crate = "paladin-ai"
lint = "constructible_struct_adds_field"
migration_row = "paladin-ai | ModelFallbackConfig"
requirement_id = "PARITY-06"
justification = "ModelFallbackConfig gained the additive steps: Vec<FallbackStepConfig> field (Phase 50, plan 50-14, D-15, #[serde(default)], empty by default) so a configuration can send each fallback hop its own model. The struct stays constructible and is deliberately NOT #[non_exhaustive] because it derives Default and in-tree literals use ..ModelFallbackConfig::default(); only a downstream full struct literal breaks. Suppressed by the root Cargo.toml's crate-wide allow line."

[[entry]]
crate = "paladin-llm"
lint = "enum_discriminants_undefined_non_unit_variant"
migration_row = "paladin-llm | FallbackChainError"
requirement_id = "PARITY-06"
justification = "FallbackChainError gained the struct variant EmptyStepModel { index } (Phase 50, plan 50-14, D-15), returned by FallbackLlmAdapter::from_steps for a step whose model is empty. The enum was already #[non_exhaustive], so a match with a wildcard arm is unaffected; its only variant was a unit variant, so the new struct variant removes its defined discriminants and a numeric cast of a variant stops compiling (nothing in the tree casts it). Suppressed by the crate-wide allow line in crates/paladin-llm/Cargo.toml."

