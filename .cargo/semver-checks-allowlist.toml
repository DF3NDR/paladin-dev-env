# D-18/D-00c convention: an entry whose `lint` value begins "register-only"
# records a deliberate break that `cargo semver-checks` cannot itself detect
# (no lint in its 0.50.0 catalog models a changed field or parameter TYPE,
# only additions/removals/count changes) -- MIGRATION.md's §9.2 row, not the
# tool, is the control for that pair. It still names exactly one crate and
# one type, mirroring every other entry in this file.

[[entry]]
crate = "paladin-web"
lint = "struct_marked_non_exhaustive"
migration_row = "paladin-web | Principal"
requirement_id = "TENANT-01"
justification = "Principal gained the required tenant_id: TenantId field (D-01), server-derived from AgentAuthConfig, never from the request (D-02), and is marked #[non_exhaustive] per X-10.3 option (a) (the LlmRequest/GarrisonEntry precedent, 40-01 Task 1 option-a) so the next field this type gains is non-breaking; Principal::new is the one constructor every external caller now uses. No backward-compatible mitigation exists for a required field on a struct with no Default; every in-tree literal was migrated in the same commit. This is the ONE entry for the pair: 40-01 predicted a second, constructible_struct_adds_field entry, but the 40-06 D-27 diagnostic (paladin-web lints table temporarily disabled, --baseline-version 0.10.1 --release-type minor) fires only struct_marked_non_exhaustive for Principal -- a struct marked #[non_exhaustive] in the same change is no longer exhaustively constructible, so the adds-field lint cannot fire -- and the predicted entry was removed rather than left contradicting the tool. Suppressed by the existing crate-wide allow line in crates/paladin-web/Cargo.toml."

