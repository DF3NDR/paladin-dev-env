version: '3.8'

services:
  # Main development container
  paladin-dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    volumes:
      - ..:/workspace:cached
      - paladin-cargo-cache:/usr/local/cargo/registry
      - paladin-target-cache:/workspace/target
      # Host-provided credentials (LLM API keys), read-only.
      # /home/vscode is part of the container filesystem and is DESTROYED on every
      # rebuild, so keys cannot live there. One file per secret, filename = variable
      # name lowercased (gemini_api_key -> GEMINI_API_KEY); see .devcontainer/paladin-env.sh.
      # Create the host directory BEFORE first launch, or the Docker daemon creates
      # it root-owned:  mkdir -p ~/.config/paladin
      - ${HOME}/.config/paladin:/home/vscode/.config/paladin:ro
      # Claude Code user state (session transcripts, history, todos, shell snapshots,
      # user settings, and the .credentials.json auth token), read-write. Unlike the
      # credentials mount above, Claude Code must be able to write here.
      # This is a DEDICATED host directory, not the host's real ~/.claude, so a Claude
      # Code session running on the host cannot race the container's.
      # Create the host directory BEFORE first launch, or the Docker daemon creates
      # it root-owned:  mkdir -p ~/.claude-paladin && chmod 700 ~/.claude-paladin
      - ${HOME}/.claude-paladin:/home/vscode/.claude
    command: /bin/sh -c "while sleep 1000; do :; done"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      - RUST_BACKTRACE=1
      - RUST_LOG=debug
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      # Claude Code's .claude.json defaults to $HOME/.claude.json, OUTSIDE the .claude
      # dir above, and Claude Code rewrites it via atomic rename -- so a single-file
      # bind mount or a symlink would be replaced by a plain file and persistence would
      # break silently. Setting this keeps .claude.json inside the mounted directory
      # instead. Verified empirically against Claude Code 2.1.239. Must stay identical
      # to the mount target above.
      - CLAUDE_CONFIG_DIR=/home/vscode/.claude
      # BASH_ENV makes NON-INTERACTIVE bash source paladin-env.sh. ~/.bashrc sources
      # it too, but only after Debian's `case $- in *i*)` early exit, so `bash -c`
      # and `bash -l` -- the shells used by tooling, git hooks and AI coding agents
      # -- never reached it and saw no credentials. Set here so it applies to every
      # process in the container and survives rebuilds.
      - BASH_ENV=/workspace/.devcontainer/paladin-env.sh
      # LLM credentials. Bare names (no "=") pass through from the host shell only
      # when set there, and stay UNSET otherwise. When unset, paladin-env.sh reads
      # them from the bind-mounted key files above.
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - DEEPSEEK_API_KEY
      - GEMINI_API_KEY
      - XAI_API_KEY
      - MOONSHOT_API_KEY
      - DASHSCOPE_API_KEY
      - OPENAI_COMPATIBLE_API_KEY
      - GH_TOKEN
    depends_on:
      - redis
      - minio
      - mysql
    networks:
      - paladin-dev-network
    ports:
      - "8080:8080"
      - "9092:9090"

  # Redis for queue management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - paladin-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO for object storage
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - paladin-dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MySQL database
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paladin
      MYSQL_USER: paladin
      MYSQL_PASSWORD: paladinpass
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - paladin-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  paladin-dev-network:
    driver: bridge

volumes:
  paladin-cargo-cache:
  paladin-target-cache:
  redis-data:
  minio-data:
  mysql-data:
