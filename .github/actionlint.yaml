# actionlint configuration.
#
# Narrowly-scoped suppression only -- do not add a rule-class-wide or
# file-wide ignore here; document exactly why any entry exists and which
# construct it covers. The actionlint CI job (ci.yml, job id
# `actionlint`) has no `continue-on-error` and fails the build on any
# finding this file does not explicitly and narrowly excuse. No `paths:`
# suppression is needed today: no workflow service container carries a
# `command:` key (the pinned RustFS image starts with its default
# entrypoint).
self-hosted-runner:
  # No self-hosted runners are used anywhere in this repository; left
  # empty deliberately rather than omitted, so a future self-hosted label
  # addition is a one-line change here instead of a rediscovery.
  labels: []
