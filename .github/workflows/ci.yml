# CI runs on a push to ANY branch (D-03). The origin incident: this filter
# named four prefixes (main/develop/feature/release) while real branch
# traffic used eight, so pushes to fix/, feat/, docs/, chore/, copilot/ and
# agent/ branches got no CI at all — and the very branch that repaired CI,
# fix/ci-workflow-health, was itself inside that blind spot for two weeks.
# Enumerating a wider prefix list was rejected: the next unsanctioned
# prefix someone invents would be dark again, so the filter matches every
# branch instead of a maintained allowlist. A push to a branch that also
# has an open PR against main will therefore run CI twice (once per
# trigger); the `concurrency` group below with `cancel-in-progress`
# absorbs that duplication, so no trigger is being dropped to avoid it.
on:
  push:
    branches: [ '**' ]
  # `release/**` added: a PR targeting a release branch must run CI. Without it
  # a PR into release/** showed almost no checks, because every workflow filtered
  # pull_request to [main] only. `develop` was pruned here (plan 15.1-09): the
  # branch was retired in plan 15.1-07's trunk cutover, and a trigger list
  # naming a ref that no longer exists is exactly the stale surface the
  # trigger-policy register in docs/src/contributing/branching-model.md
  # exists to catch.
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

concurrency:
  # Collapses the duplicate push+pull_request runs the trigger comment above
  # describes. `head_ref` is set only on pull_request; on push it is empty and
  # this falls back to `ref`, so both runs for one branch share a group.
  # Not cancel-in-progress on main: a completed run on the default branch is a
  # release-history record, not just a PR signal.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Code quality checks
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check documentation
        run: cargo doc --workspace --no-deps 2>&1 | tee /tmp/doc-output.txt && ! grep -q "warning:" /tmp/doc-output.txt

  # Lints every workflow file in .github/workflows/, including the five this
  # job does not live in. Needs no toolchain, no cache and no services --
  # the cheapest job in the pipeline. Pinned to a concrete release rather
  # than `latest` (T-15-SC); fails the build on any finding, no
  # continue-on-error, no narrowed file scope (T-15-04).
  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download and run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint .github/workflows/*.yml

  # Security audit with controlled RustSec exceptions
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Exceptions are the single source of truth in `.cargo/audit.toml` (see its
      # `[advisories].ignore` list). cargo-audit auto-discovers `.cargo/audit.toml`
      # from the repo, so no inline `--ignore` flags are used here.
      - name: Run cargo-audit (exceptions from .cargo/audit.toml)
        run: cargo audit

  # License compliance and dependency bans
  cargo-deny:
    name: License & Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Check per-crate changelogs
        run: ./scripts/check-changelogs.sh

      - name: Check crates.io package names
        run: ./scripts/check-crate-names.sh

      - name: Check advisory exception register
        run: ./scripts/check-advisory-register.sh

      - name: Check workflow files for inline advisory suppressions
        run: ./scripts/check-workflow-suppressions.sh

      - name: Check workflow trigger policy
        run: ./scripts/check-workflow-triggers.sh

      # 18-04: CODEQL-DISMISSALS.md is the governed register for dismissed
      # CodeQL alerts (T-18-16..20). This guard is offline and validates
      # only the register's own internal consistency and staleness -- it
      # is not itself a claim that codeql.yml is a required check (it is
      # advisory-only per 18-CODEQL-EVIDENCE.md's Verdict).
      - name: Check CodeQL dismissal register
        run: ./scripts/check-codeql-dismissals.sh

      # Closes a pre-existing gap (D-09b, plan 15.1-09): the sibling
      # check-workflow-suppressions_test.sh regression harness has existed
      # since Phase 12 but was wired only into `make test-shell-guards`,
      # which no workflow invoked -- so it never ran in CI. This one step
      # now runs that harness, check-workflow-triggers_test.sh and
      # check-codeql-dismissals_test.sh (18-04), all three added alongside
      # each other into the same aggregate.
      - name: Run shell-guard regression tests
        run: make test-shell-guards

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # Policy lives in the version-controlled `deny.toml` (licenses, bans,
      # advisories, sources). Fails on disallowed licenses or advisories not
      # excepted in deny.toml/.cargo/audit.toml.
      - name: Run cargo-deny check
        run: cargo deny check

  # Supplementary vulnerability scanning via Google's OSV database.
  # Annotate-only (non-blocking) initially to avoid contradicting the
  # cargo-audit gate; results surface as PR annotations via SARIF upload.
  osv-scanner:
    name: OSV Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run OSV-Scanner
        # Pinned official reusable workflow action; scans Cargo.lock and emits SARIF.
        uses: google/osv-scanner-action/osv-scanner-action@v1.9.1
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --format=sarif
            --output=osv-results.sarif

      - name: Upload OSV-Scanner results (PR annotations)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
        continue-on-error: true

  # API surface tracking
  api-surface:
    name: API Surface Tracking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly toolchain
        run: rustup toolchain install nightly

      - name: Install cargo-public-api
        run: cargo install cargo-public-api

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Check API surface changes
        run: ./scripts/check-api-surface.sh .project/current-exports.txt

      - name: Check deprecation warnings
        run: ./scripts/check-deprecations.sh

      - name: Generate API diff on failure
        if: failure()
        run: |
          echo "API surface has changed. Generating diff..."
          ./scripts/extract-public-api.sh /tmp/current-api.txt
          diff -u .project/current-exports.txt /tmp/current-api.txt || true
          echo ""
          echo "If this change is intentional:"
          echo "  1. Review the changes carefully"
          echo "  2. Update CHANGELOG.md with breaking changes"
          echo "  3. Update the baseline: ./scripts/extract-public-api.sh .project/current-exports.txt"
          echo "  4. Commit the updated baseline"

  # MSRV verification (X-11.1, D-07). Dedicated job pinned to the workspace's
  # declared `rust-version = "1.85"` (all 11 publishable manifests, see
  # MIGRATION.md §9.3), independent of and parallel with every other job --
  # no `needs:` edge, so it cannot gate or be gated by anything else. The
  # pinned dev toolchain (rust-toolchain.toml, 1.97.1) would otherwise
  # override whatever this job installs; RUSTUP_TOOLCHAIN is the same
  # documented opt-out the `test` job below already uses for its stable/beta
  # matrix. `--all-features --all-targets` builds the full workspace,
  # including every optional adapter, at the floor version -- not just the
  # default feature set -- so a feature-gated dependency that silently needs
  # a newer compiler cannot hide behind `default-features`.
  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85

      - name: Check workspace at MSRV (all features, all targets)
        run: cargo check --workspace --all-features --all-targets

  # cargo-semver-checks (X-10.5, D-06). Guards every pre-existing public Rust
  # API against the PUBLISHED v0.9.0 baseline on crates.io. Two things the
  # tool's own defaults get wrong for this repo, both overridden explicitly
  # below (RESEARCH.md Pitfalls 1-2):
  #   - Baseline: the tool defaults to "latest published", not a fixed
  #     version. `--baseline-version 0.9.0` pins the comparison so an
  #     out-of-band crates.io patch release cannot silently move it.
  #   - Package identity: this workspace's `crates/*` directory names differ
  #     from their published crates.io package names -- `crates/paladin-core`
  #     publishes as `paladin-ai-core`. Every publishable crate below is
  #     addressed by its PUBLISHED name, not its directory name; a
  #     directory-named `--package` flag would match zero packages and report
  #     a silent, meaningless pass (the exact failure mode this job exists to
  #     prevent, T-22-12).
  # `--default-features` (verified locally against every one of the 11
  # packages before landing this job): without it, cargo-semver-checks's own
  # "enable everything except unstable/nightly" heuristic pulls in every
  # optional feature combination at once, which trips a PRE-EXISTING,
  # unrelated compile break -- `paladin-memory`'s `qdrant` adapter fails to
  # build rustdoc against the `qdrant-client` 1.18.0 resolved today (pinned
  # `^1.14`), because that version added a required `memory` field to
  # `VectorParams`. That defect belongs to whichever phase next touches the
  # Sanctum/Qdrant adapter, not this one (deferred:
  # .planning/phases/22-battlefield-state-superstep-engine/22-deferred-items.md)
  # -- Phase 22 does not touch `paladin-memory`'s qdrant module at all.
  # Checking under each crate's own default features is also arguably the
  # more correct semver-gate scope: it is the build a crates.io consumer gets
  # by just adding the dependency, and it is what every one of the 11
  # packages was verified to pass cleanly against the 0.9.0 baseline with.
  # No `needs:` edge; the job writes no baseline/artifact file into the
  # working tree, so re-running it on an unchanged commit reaches an
  # identical verdict every time.
  semver:
    name: Semver Checks (vs v0.9.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: semver-checks

      # Pinned to a tagged release rather than a moving branch ref
      # (RESEARCH.md Standard Stack note; T-22-SC).
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.50.0

      # Every publishable crate, addressed by its crates.io PACKAGE name (see
      # the job comment above) -- never a `crates/` directory path.
      - name: Check semver against the published v0.9.0 baseline
        run: |
          set -euo pipefail
          PACKAGES=(
            paladin-ai
            paladin-ai-core
            paladin-ports
            paladin-battalion
            paladin-herald
            paladin-llm
            paladin-memory
            paladin-storage
            paladin-notifications
            paladin-content
            paladin-web
          )
          for pkg in "${PACKAGES[@]}"; do
            echo "::group::cargo semver-checks -- ${pkg} vs 0.9.0"
            cargo semver-checks check-release --package "${pkg}" --default-features --baseline-version 0.9.0
            echo "::endgroup::"
          done

      # X-10.5 set-equality gate: every allowlist entry in
      # .cargo/semver-checks-allowlist.toml must correspond to a MIGRATION.md
      # §9.2 row marked deliberate-breaking (`Y`), and every such row must
      # have a matching allowlist entry. Reads both files directly -- a
      # missing file fails this step rather than silently treating either
      # side as an empty set.
      - name: Verify allowlist is set-equal to the MIGRATION.md §9.2 register
        run: |
          set -euo pipefail
          test -f .cargo/semver-checks-allowlist.toml
          test -f MIGRATION.md

          # Deliberate-breaking §9.2 rows: the "Deliberate-breaking?" column
          # (6th pipe-delimited field) starting with "Y". Scoped to the §9.2
          # section only, so a "Y" elsewhere in the document can't leak in.
          # Trimming happens inside awk (no sed backreferences) to keep this
          # script shellcheck-clean.
          awk '/^## 9\.2 /{flag=1; next} /^## 9\.3 /{flag=0} flag' MIGRATION.md \
            | grep -E '^\|' \
            | awk -F'|' '{
                crate=$2; gsub(/^[ \t`]+|[ \t`]+$/, "", crate);
                deliberate=$6; gsub(/^[ \t]+|[ \t]+$/, "", deliberate);
                if (deliberate ~ /^Y/) print crate
              }' \
            | sort -u > /tmp/migration-deliberate-crates.txt

          # Allowlist entries: each [[entry]] carries a `crate = "..."` key.
          # Extracted via awk field-splitting on the quote character rather
          # than a sed backreference, for the same shellcheck-cleanliness reason.
          grep -E '^\s*crate\s*=' .cargo/semver-checks-allowlist.toml \
            | awk -F'"' '{print $2}' \
            | sort -u > /tmp/allowlist-crates.txt

          echo "MIGRATION.md §9.2 deliberate-breaking crates:"
          cat /tmp/migration-deliberate-crates.txt
          echo "Allowlist crates:"
          cat /tmp/allowlist-crates.txt

          if ! diff -u /tmp/migration-deliberate-crates.txt /tmp/allowlist-crates.txt; then
            echo "::error::Allowlist and MIGRATION.md §9.2 deliberate-breaking rows are not set-equal (see diff above)."
            exit 1
          fi
          echo "Allowlist is set-equal to the MIGRATION.md §9.2 deliberate-breaking register."

  # Unit tests
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust-version: [stable, beta]
    env:
      # This job deliberately tests toolchains *other* than the pinned one.
      # rust-toolchain.toml takes precedence over whatever the setup action
      # installs, so without this override both matrix legs would silently run
      # on the pinned version and the beta forward-compat check would be a
      # no-op. RUSTUP_TOOLCHAIN is the documented way to opt out of the file.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace --lib --bins

      - name: Run doc tests
        run: cargo test --workspace --doc

  # Example muster: builds every example target in examples/ via a 4-invocation
  # feature matrix (REL-05/SC5).
  examples:
    name: Example Muster (Feature Matrix)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Replaces the three hand-rolled actions/cache@v4 steps (registry, git
      # index, target dir) that previously lived here (D-10). This is the one
      # job in the repository that hard-fails on a cache miss: a cold cache
      # left `~/.cargo/registry` empty while the four build steps below assert
      # a hermetic, network-free build, so any lockfile change failed the job
      # outright rather than degrading to a slower build. `cache-on-failure:
      # true` keeps the cache warm for the next run even when this job fails
      # partway through.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Load-bearing, not redundant with the cache action above: the cache's
      # own restore-keys fallback (if it misses) would restore a cache keyed
      # on an OLDER Cargo.lock generation, which by construction lacks any
      # crate that generation didn't contain -- the same limitation a bare
      # restore-keys fallback would have had. Only `cargo fetch --locked`
      # guarantees every crate Cargo.lock names is present locally before the
      # four hermetic build steps below run. Uses the network exactly once
      # per job and never rewrites the lockfile.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # examples/ holds 47 .rs files. Exactly 4 are declared [[example]] targets
      # in Cargo.toml, and every one of those 4 gates on a feature outside the
      # default set (`default = ["llm-openai"]`): vision_analysis/vision_battalion
      # need "vision,llm-openai", document_processing needs "content-processing",
      # http_service_host needs "web-server". cargo's bulk `--examples` selector
      # SILENTLY SKIPS targets whose required-features are unmet — no error, no
      # warning, exit code 0 (verified live during 04-RESEARCH.md Part B, Q1(b)).
      # A single bare `cargo build --examples` step would therefore report success
      # while covering only 43 of 47 targets, with nothing flagging the gap. The
      # 4 invocations below are the minimum needed to cover all 47.
      - name: Build examples (default features — 43 auto-discovered targets)
        run: cargo build --examples --offline

      - name: Build examples (vision — vision_analysis, vision_battalion)
        run: cargo build --example vision_analysis --example vision_battalion --features "vision,llm-openai" --offline

      - name: Build examples (content-processing — document_processing)
        run: cargo build --example document_processing --features "content-processing" --offline

      - name: Build examples (web-server — http_service_host)
        run: cargo build --example http_service_host --features "web-server" --offline

      # Assert the full 47-target count. Match on basenames derived from the
      # example source files rather than raw `ls`, since cargo also emits `.d`
      # dependency files and hash-suffixed duplicates into target/debug/examples.
      - name: Assert all 47 example binaries were produced
        run: |
          EXPECTED=$(find examples -name '*.rs' | wc -l)
          FOUND=0
          MISSING=""
          for f in examples/*.rs; do
            name=$(basename "$f" .rs)
            if [ -x "target/debug/examples/$name" ] && [ ! -d "target/debug/examples/$name" ]; then
              FOUND=$((FOUND + 1))
            else
              MISSING="$MISSING $name"
            fi
          done
          echo "Expected: $EXPECTED example binaries; found: $FOUND"
          if [ "$FOUND" -ne "$EXPECTED" ]; then
            echo "::error::Expected $EXPECTED example binaries, found $FOUND. Missing:$MISSING"
            exit 1
          fi

  # Crate isolation: verify each workspace member builds and tests independently
  crate-isolation:
    name: Crate Isolation (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: paladin-ai-core
            extra_flags: ""
          - crate: paladin-ports
            extra_flags: ""
          - crate: paladin-battalion
            extra_flags: ""
          - crate: paladin-llm
            extra_flags: "--all-features"
          - crate: paladin-memory
            extra_flags: "--all-features"
          - crate: paladin-storage
            extra_flags: ""
          - crate: paladin-notifications
            extra_flags: ""
          - crate: paladin-content
            extra_flags: ""
          - crate: paladin-web
            extra_flags: ""
          - crate: paladin-ai
            extra_flags: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build -p ${{ matrix.crate }}

      - name: Build (no default features)
        run: cargo build -p ${{ matrix.crate }} --no-default-features

      - name: Build and test (extra flags)
        run: |
          cargo build -p ${{ matrix.crate }} ${{ matrix.extra_flags }}
          cargo test -p ${{ matrix.crate }} ${{ matrix.extra_flags }}

  # Integration tests with external services
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        ports:
          - 9010:9000
          - 9011:9001
        env:
          MINIO_ROOT_USER: testuser
          MINIO_ROOT_PASSWORD: testpass123
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 30s
          --health-timeout 20s
          --health-retries 3
        # MinIO requires an explicit command argument to start as a server
        # (matches integration-tests.yml's identical MinIO block); actionlint
        # flags `command` as an unrecognized `services` key against its
        # strict schema, but GitHub Actions applies it at runtime. See
        # .github/actionlint.yaml for the narrowly-scoped suppression.
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install MinIO Client
        run: |
          wget https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

      - name: Setup MinIO buckets
        run: |
          mc alias set testminio http://localhost:9010 testuser testpass123
          mc mb testminio/test-bucket --ignore-existing
          mc mb testminio/integration-tests --ignore-existing
          echo "MinIO buckets created successfully"

      - name: Wait for services
        run: |
          echo "Waiting for Redis..."
          for _ in {1..30}; do
            if redis-cli -h localhost -p 6380 ping; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

          echo "Waiting for MinIO..."
          for _ in {1..30}; do
            if curl -f http://localhost:9010/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            sleep 1
          done

      - name: Run integration tests
        env:
          USE_EXTERNAL_TEST_SERVICES: "true"
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6380
          TEST_MINIO_ENDPOINT: localhost:9010
          TEST_MINIO_ACCESS_KEY: testuser
          TEST_MINIO_SECRET_KEY: testpass123
          RUST_LOG: debug
        run: |
          echo "Running Redis integration tests..."
          cargo test redis_queue_integration_tests --release -- --ignored --nocapture

          echo "Running file storage integration tests..."
          cargo test file_storage_integration_tests --release -- --ignored --nocapture

      # Absorbed from the now-deleted integration-tests.yml (D-09). This is the
      # broad `--workspace --features integration-tests` suite, distinct from
      # the two narrow `--ignored` targets above -- not a duplicate of them,
      # additional coverage that previously only ran on `pull_request` and a
      # nightly cron and now runs on every push to every branch (D-03). Uses
      # this job's TEST_REDIS_*/TEST_MINIO_* environment variable names and
      # 6380/9010 ports rather than integration-tests.yml's REDIS_URL/
      # MINIO_ENDPOINT names and default 6379/9000 ports, so it addresses the
      # same service containers this job's services: block above already
      # started -- see 15.1-PATTERNS.md's port-mapping table.
      - name: Run broad workspace integration suite
        env:
          USE_EXTERNAL_TEST_SERVICES: "true"
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6380
          TEST_MINIO_ENDPOINT: localhost:9010
          TEST_MINIO_ACCESS_KEY: testuser
          TEST_MINIO_SECRET_KEY: testpass123
          RUST_LOG: debug
        run: cargo test --workspace --features integration-tests --verbose -- --test-threads=1

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            target/debug/
            *.log

  # Absorbed from the now-deleted integration-tests.yml (D-09). Distinct
  # purpose from the `integration-tests` job above: this one exercises the
  # Docker Compose test stack itself (image build + container orchestration),
  # not the workspace's Rust test suite, so it keeps its own display name
  # rather than folding into that job. No job of this name existed in this
  # file before this plan, and the source job carried no Rust build cache of
  # its own (its build happens entirely inside `docker compose build`), so
  # there is no hand-rolled `actions/cache@v4` pattern to replace here.
  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build integration test image
        run: docker compose -f docker/docker-compose.test.yml build integration-tests

      - name: Start infrastructure services
        run: |
          docker compose -f docker/docker-compose.test.yml up -d redis-test minio-test minio-test-init
          # Wait for MinIO init container to finish creating buckets
          timeout 120 sh -c 'until docker inspect paladin-minio-test-init --format="{{.State.Status}}" 2>/dev/null | grep -q exited; do sleep 2; done'
          echo "Infrastructure services ready"

      - name: Run integration tests in Docker
        run: |
          docker compose -f docker/docker-compose.test.yml run --no-deps --rm integration-tests

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.test.yml logs

      - name: Stop services
        if: always()
        run: |
          docker compose -f docker/docker-compose.test.yml down -v

  # Ollama live-server integration (PROV-03). The `ollama_docker` target needs a
  # real Ollama server, so no authoring environment can run it — every attempt was
  # recorded as unverified. This job is the only place it actually executes.
  #
  # The suite SKIPS (and therefore PASSES) when the server is unreachable, by
  # design, so that a developer without Docker is not blocked. That makes a naive
  # job worthless: it would report green having exercised nothing. The explicit
  # reachability assertion and the SKIP-detection step below are what give this job
  # its meaning — do not remove them.
  ollama-integration:
    name: Ollama Integration Tests (live server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ollama-integration

      - name: Start ollama-test and pull the model
        run: |
          docker compose -f docker/docker-compose.test.yml up -d ollama-test
          echo "Waiting for ollama-test to report healthy..."
          # Matches the house style used by docker-integration above: pipe into grep
          # rather than command-substituting inside single quotes (shellcheck SC2016).
          # -x is load-bearing: a plain `grep -q healthy` also matches "unhealthy".
          timeout 300 sh -c 'until docker inspect paladin-ollama-test --format="{{.State.Health.Status}}" 2>/dev/null | grep -qx healthy; do sleep 3; done'
          # ollama-test-init pulls qwen2.5:0.5b and exits; run it in the foreground
          # so the model is present before any test starts.
          docker compose -f docker/docker-compose.test.yml up --exit-code-from ollama-test-init ollama-test-init

      - name: Assert the live server and model are present
        run: |
          set -o pipefail
          curl -fsS http://localhost:11435/v1/models | tee /tmp/ollama-models.json
          grep -q 'qwen2.5:0.5b' /tmp/ollama-models.json \
            || { echo "::error::qwen2.5:0.5b missing from the live model list"; exit 1; }

      - name: Run Ollama integration tests
        run: |
          set -o pipefail
          cargo test --features integration-tests,llm-ollama --test ollama_docker \
            -- --nocapture 2>&1 | tee /tmp/ollama-test.log

      - name: Fail if the suite took the SKIP path
        run: |
          if grep -q 'SKIP:' /tmp/ollama-test.log; then
            echo "::error::ollama_docker took the SKIP path — the live server was NOT exercised."
            grep 'SKIP:' /tmp/ollama-test.log
            exit 1
          fi
          echo "All ollama_docker tests exercised the live server."

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.test.yml logs ollama-test ollama-test-init

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  # Postgres live-server integration (G-22-1, ENG-05). The PostgresWaypointStore
  # Tier 2 contract suite is env-gated on WAYPOINT_POSTGRES_TEST_URL and returns
  # early -- and therefore passes -- when no server is reachable. Nothing in
  # this repository sets that variable except `make test-integration-docker`,
  # which needs a local Docker daemon no development environment here has, so
  # before this job the suite executed in no environment at all while every CI
  # run reported green -- the same failure shape Phase 17 found and fixed for
  # the Ollama suite above.
  #
  # The reachability assertion (`pg_isready`), the early-return detection step
  # and the selected-count assertion below are what give this job its meaning
  # -- do not remove them.
  postgres-integration:
    name: Postgres Waypoint Contract Suite (live server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: postgres-integration

      - name: Start postgres-test and wait for healthy
        run: |
          docker compose -f docker/docker-compose.test.yml up -d postgres-test
          echo "Waiting for postgres-test to report healthy..."
          # Matches the house style used by ollama-integration above: pipe into
          # grep rather than command-substituting inside single quotes
          # (shellcheck SC2016). -x is load-bearing: a plain `grep -q healthy`
          # also matches "unhealthy".
          timeout 180 sh -c 'until docker inspect paladin-postgres-test --format="{{.State.Health.Status}}" 2>/dev/null | grep -qx healthy; do sleep 3; done'

      - name: Assert the live server accepts connections
        run: docker exec paladin-postgres-test pg_isready -U paladin -d paladin_waypoint_test

      - name: Run PostgresWaypointStore contract suite
        run: |
          set -o pipefail
          # --nocapture: store_or_skip() announces its early-return path on
          # stdout, which cargo swallows without it -- the detection step below
          # would have nothing to read. --test-threads=1: this module's tests
          # share one database (unlike the SQLite suite's per-test in-memory
          # database), and
          # list_threads_empty_then_three_threads_newest_activity_first asserts
          # a literally empty store; under default parallelism a peer test's
          # writes land inside that assertion's window and the job goes red for
          # a reason that is not a real contract violation.
          WAYPOINT_POSTGRES_TEST_URL=postgres://paladin:paladin@localhost:5433/paladin_waypoint_test \
            cargo test -p paladin-storage --features postgres --lib waypoint::postgres \
            -- --test-threads=1 --nocapture 2>&1 | tee /tmp/postgres-waypoint-test.log

      - name: Fail if the suite took the SKIP path
        run: |
          if grep -q 'SKIP:' /tmp/postgres-waypoint-test.log; then
            echo "::error::waypoint::postgres took the SKIP path — the live server was NOT exercised."
            grep 'SKIP:' /tmp/postgres-waypoint-test.log
            exit 1
          fi
          echo "All waypoint::postgres tests exercised the live server."

      - name: Fail if the suite selected fewer tests than it declares
        run: |
          set -o pipefail
          EXPECTED=$(grep -c '#\[tokio::test\]' crates/paladin-storage/src/waypoint/postgres.rs)
          ACTUAL=$(grep -oP 'test result: ok\. \K[0-9]+(?= passed)' /tmp/postgres-waypoint-test.log | tail -1)
          echo "Declared tests: $EXPECTED, passed: ${ACTUAL:-0}"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" -lt "$EXPECTED" ]; then
            echo "::error::waypoint::postgres selected fewer tests (${ACTUAL:-0}) than the module declares ($EXPECTED) -- a stale or mistyped filter would report green having run nothing."
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.test.yml logs postgres-test

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  # Coverage measurement (PIPE-02) — MEASURE-ONLY as of this commit: no minimum-
  # threshold flag. D-04 requires the figure to be measured before the floor
  # derived from it can be set; plan 15-03 adds the threshold once this job has
  # produced the reference measurement. Scoped to `--features integration-tests`
  # per D-01, not `--all-features` — `qdrant` and the vision/embedding suites need
  # live services/API keys CI cannot provide, which would depress the number for
  # no signal.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: minio/minio:latest
        ports:
          - 9010:9000
          - 9011:9001
        env:
          MINIO_ROOT_USER: testuser
          MINIO_ROOT_PASSWORD: testpass123
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 30s
          --health-timeout 20s
          --health-retries 3
        # MinIO requires an explicit command argument to start as a server
        # (matches integration-tests.yml's identical MinIO block); actionlint
        # flags `command` as an unrecognized `services` key against its
        # strict schema, but GitHub Actions applies it at runtime. See
        # .github/actionlint.yaml for the narrowly-scoped suppression.
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install MinIO Client
        run: |
          wget https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

      - name: Setup MinIO buckets
        run: |
          mc alias set testminio http://localhost:9010 testuser testpass123
          mc mb testminio/test-bucket --ignore-existing
          mc mb testminio/integration-tests --ignore-existing
          echo "MinIO buckets created successfully"

      - name: Wait for services
        run: |
          echo "Waiting for Redis..."
          for _ in {1..30}; do
            if redis-cli -h localhost -p 6380 ping; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

          echo "Waiting for MinIO..."
          for _ in {1..30}; do
            if curl -f http://localhost:9010/minio/health/live; then
              echo "MinIO is ready"
              break
            fi
            sleep 1
          done

      - name: Measure coverage
        env:
          USE_EXTERNAL_TEST_SERVICES: "true"
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6380
          TEST_MINIO_ENDPOINT: localhost:9010
          TEST_MINIO_ACCESS_KEY: testuser
          TEST_MINIO_SECRET_KEY: testpass123
        # Delegates to scripts/coverage.sh — shared with `make coverage`. The script
        # adds llm-all: without it the default feature set compiles only the three
        # pre-Phase-17 adapters, so the six newer ones contributed zero instrumented
        # lines and this gate could not catch a regression in any of them.
        # The TEST_* vars above are pre-set and always win over the script's probing.
        run: bash scripts/coverage.sh

      # `--lcov --output-path` writes a file and prints NOTHING, so the measured
      # percentage never reaches the run log. Plan 15-03 has to read that figure
      # out of CI (docker is absent from every authoring environment, so it
      # cannot be produced locally) and its recorded method is to grep the log --
      # which found nothing to grep.
      #
      # The summary is derived from `lcov.info` rather than from
      # `cargo llvm-cov report`, because neither form of that command reports the
      # gated scope:
      #   * `cargo llvm-cov report --summary-only` covers only the root
      #     `paladin-ai` package (14,018 of 47,618 lines) -- a smaller, rosier
      #     figure than the line minimum above enforces. This is the discrepancy
      #     ADR-0006's Phase 15 amendment documents.
      #   * `cargo llvm-cov report --summary-only --workspace` is not a valid
      #     invocation at all: "--workspace is specific to [test, nextest,
      #     nextest-archive, show-env, clean, no subcommand] and not supported
      #     for subcommand 'report'". It exits non-zero and prints nothing.
      # `lcov.info` IS the artifact the gate measured, so summing its per-file
      # LF/LH and FNF/FNH records cannot drift from what was gated -- the same
      # summation the ADR amendment records and anyone can reproduce from the
      # uploaded artifact.
      #
      # `set -o pipefail` is load-bearing: without it `<cmd> | tee file` exits
      # with tee's status, so a failing command yields an empty file and a GREEN
      # step. That is precisely how the invalid `--workspace` form went unnoticed.
      - name: Coverage summary
        run: |
          set -euo pipefail
          test -s lcov.info || { echo "::error::lcov.info missing or empty — coverage was not measured"; exit 1; }
          python3 - <<'PY' | tee coverage-summary.txt
          lf = lh = fnf = fnh = 0
          for line in open("lcov.info"):
              if   line.startswith("LF:"):  lf  += int(line[3:])
              elif line.startswith("LH:"):  lh  += int(line[3:])
              elif line.startswith("FNF:"): fnf += int(line[4:])
              elif line.startswith("FNH:"): fnh += int(line[4:])
          if lf == 0:
              raise SystemExit("::error::lcov.info contains no LF: records")
          print("Scope: --workspace --features integration-tests (the gated measurement)")
          print(f"Lines:     {lh}/{lf} = {100*lh/lf:.2f}%")
          print(f"Functions: {fnh}/{fnf} = {100*fnh/fnf:.2f}%")
          PY
          {
            echo "### Coverage (workspace, --features integration-tests)"
            echo ""
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            coverage-summary.txt
            lcov.info
          retention-days: 14

      # Report-only: .codecov.yml sets informational: true on both status
      # blocks, so this upload never gates a build. Without CODECOV_TOKEN
      # an upload can fail silently (especially on fork PRs), which is why
      # fail_ci_if_error is deliberately not set here (D-02) -- the real
      # threshold gate is the cargo llvm-cov line-coverage minimum flag above.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: combined
          token: ${{ secrets.CODECOV_TOKEN }}

  # CLI snapshot tests (PIPE-01) — a dedicated job, not a step inside
  # `crate-isolation`, per D-07: a distinctly named job makes a broken CLI
  # snapshot legible in the PR checks list instead of surfacing as a red
  # `crate-isolation (paladin-ai)` leg a reviewer has to open to understand.
  # `--features cli` is the entire point of this job — the `cli` test target
  # declares `required-features = ["cli"]`, and Cargo silently skips a target
  # whose required features are inactive (no error, no output, zero tests run).
  cli-tests:
    name: CLI Snapshot Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run CLI snapshot tests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p paladin-ai --features cli --test cli 2>&1 | tee cli-test-output.log
          executed=$(grep -oE '[0-9]+ passed' cli-test-output.log | tail -1 | grep -oE '[0-9]+')
          if [ -z "$executed" ] || [ "$executed" -eq 0 ]; then
            echo "::error::cli-tests reported zero executed tests. This usually means --features cli was dropped, causing Cargo to silently skip the required-features-gated cli test target."
            exit 1
          fi
          echo "cli-tests executed $executed test(s)"

  # Benchmark compile-check (PIPE-01) — compiles every [[bench]] target without
  # executing it: no Criterion runtime, no performance numbers, no timing
  # output. This is the missing compile-check prerequisite for the existing
  # scheduled `benchmark` job and the `benchmark-regression-signal` job, not a
  # replacement for either — both are left untouched.
  bench-check:
    name: Benchmark Compile Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Compile-check benchmarks
        run: cargo bench --workspace --no-run

  # Build and test Docker images
  #
  # AUTHORED AND STATICALLY VALIDATED ONLY — docker is absent from the
  # environment that authored this job (verified 2026-08-02). It has never
  # been executed. See .planning/phases/04-release-coherence/04-ci-gate-deferrals.md
  # for the deferral record; do not read a green run of this file as proof
  # these two budgets have ever been met.
  #
  # The 500 MB size budget has enormous headroom against the corpus's only
  # measurement (112 MB, PROJECT.md:767). The 300 s time budget has none: the
  # same measurement records 5m31s for a SINGLE-ARCH build, and this job adds
  # linux/arm64 via QEMU emulation on top. This gate is expected to be red on
  # its first real execution, and that red is the measurement REL-05 has never
  # taken — do not soften it to a warning to make it look achievable.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Record build start time
        id: build_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: paladin:test
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Wall-clock is ADVISORY for the multi-arch build, and deliberately so.
      #
      # SC5's "< 5 min" figure derives from PROJECT.md:767 — "112 MB built in
      # 5m31s" — which was a SINGLE-ARCH Milestone 1 measurement. Applied to a
      # multi-arch build it has never been met, not once, in this repository's
      # history: v0.4.2 48m09s, v0.4.3 47m58s, v0.5.0 41m47s, v0.5.1 44m03s
      # (Release workflow), and 49m43s on the first CI run of this job
      # (2026-08-03, measured 2946s). Dockerfile:33 runs `cargo build --release
      # --workspace` with no `--target`, so buildx compiles the whole workspace
      # once per platform and the linux/arm64 pass runs under QEMU emulation —
      # roughly an order of magnitude slower than native amd64.
      #
      # Under emulation this number measures the GitHub runner, not Paladin, so
      # it is reported rather than enforced. The real fix is native arm64
      # runners (`ubuntu-24.04-arm`, free for public repos) instead of QEMU;
      # once that lands, a hard budget backed by a real measurement should be
      # reinstated. Owner: a future infrastructure phase (reassigned dated
      # 2026-08-13, Phase 15 plan 15-10 — Phase 15 declined this rework as
      # out of scope; no requirement ID covers it and CONTEXT.md's Deferred
      # Ideas places it out of scope for this phase. See
      # .planning/ledgers/milestone-09-12.md's decline record for the reason
      # and reopening condition; Phase 15 has closed).
      #
      # The image-size budget below stays HARD — size is a property of the
      # artifact, not of the runner, and the last successful multi-arch build
      # measured 86 MB against the 500 MB budget.
      - name: Report build wall-clock (advisory; budget scoped to single-arch)
        run: |
          START=${{ steps.build_start.outputs.start }}
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "Docker multi-arch build wall-clock time: ${ELAPSED}s"
          if [ "$ELAPSED" -gt 300 ]; then
            echo "::warning::Docker multi-arch build took ${ELAPSED}s, over the 300s single-arch-derived budget. Advisory only — see Phase 15 / PIPE for the native-arm64 rework that would make a hard budget meaningful."
          fi

      # A multi-platform buildx build produces a manifest list, which CANNOT be
      # loaded into the local Docker image store — `load: true` is single-platform
      # only. The multi-arch step above therefore leaves nothing for
      # `docker image inspect` to find, which is why the size assertion failed
      # with "No such image: paladin:test" on its first real execution
      # (run 30839816736, 2026-08-03).
      #
      # Re-build the amd64 leg alone with `load: true` so there is a concrete
      # image to measure. Every layer is already in the GHA cache from the step
      # above, so this is a cache hit, not a second compile. amd64 is also the
      # arch the 500 MB budget has always described — the historical 86 MB and
      # 112 MB figures are both single-arch.
      - name: Load amd64 image for size measurement
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: paladin:test
          platforms: linux/amd64
          cache-from: type=gha

      - name: Assert image size budget (<= 500 MB)
        run: |
          # Inspects the amd64 image loaded by the step above. Do NOT point this
          # at the multi-arch build — that produces a manifest list with no local
          # image to inspect (see the comment on the load step).
          SIZE=$(docker image inspect paladin:test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 500 ]; then
            echo "::error::Image size (${SIZE_MB} MB) exceeds the 500 MB budget"
            exit 1
          fi

      - name: Test Docker Compose
        run: |
          cp .env.example .env
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.test.yml config
          echo "Docker Compose configuration validated"

  # Kubernetes smoke test via kind — reuses integration-tests.yml's working
  # kubernetes-smoke-test job shape rather than reinventing it.
  #
  # AUTHORED AND STATICALLY VALIDATED ONLY — kind and kubectl are absent from
  # the environment that authored this job (verified 2026-08-02). It has never
  # been executed. See
  # .planning/phases/04-release-coherence/04-ci-gate-deferrals.md.
  #
  # Caveat carried over from the source job: k8s/deployment.yaml:66-68 runs a
  # placeholder `sleep 3600` command with all three probes (liveness/readiness/
  # startup, k8s/deployment.yaml:137-174) commented out pending paladin-web
  # health endpoints. This budget therefore measures container scheduling, not
  # application readiness. The job still proves the kind/kubectl orchestration
  # and the manifest set apply cleanly, which is what this gate asks for; real
  # readiness-probe wiring is Phase 14 / WEB's.
  kubernetes-smoke:
    name: Kubernetes Smoke Test
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up kind (Kubernetes in Docker)
        uses: helm/kind-action@v1
        with:
          version: v0.20.0
          cluster_name: paladin-test

      - name: Verify cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create namespace
        run: kubectl create namespace paladin

      - name: Create secret (with dummy values)
        run: |
          kubectl create secret generic paladin-secrets \
            --from-literal=OPENAI_API_KEY=dummy \
            --from-literal=DEEPSEEK_API_KEY=dummy \
            --from-literal=ANTHROPIC_API_KEY=dummy \
            --from-literal=MINIO_ROOT_USER=minioadmin \
            --from-literal=MINIO_ROOT_PASSWORD=minioadmin \
            --from-literal=MINIO_ACCESS_KEY=paladin \
            --from-literal=MINIO_SECRET_KEY=paladin-secret \
            -n paladin

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/minio.yaml
          sleep 20

      - name: Wait for dependencies
        run: |
          kubectl wait --for=condition=ready pod -l app=redis -n paladin --timeout=120s
          kubectl wait --for=condition=ready pod -l app=minio -n paladin --timeout=120s

      - name: Build and load Docker image
        run: |
          docker build -t paladin:test .
          kind load docker-image paladin:test --name paladin-test

      - name: Deploy Paladin
        run: |
          # Use test image tag
          sed 's/paladin:latest/paladin:test/g' k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml

      - name: Wait for Paladin pods
        run: |
          # Improvement over the copied source job: the source's `|| true` lets
          # a timeout pass silently. A pod that never becomes ready must fail
          # this smoke test.
          kubectl wait --for=condition=ready pod -l app=paladin -n paladin --timeout=180s
          kubectl get pods -n paladin

      - name: Check pod status
        run: |
          kubectl get pods -n paladin
          kubectl describe pods -n paladin
          kubectl logs -l app=paladin -n paladin --tail=100 || true

      - name: Verify startup time (<= 30s)
        run: |
          START_TIME=$(kubectl get pod -l app=paladin -n paladin -o jsonpath='{.items[0].status.startTime}')
          READY_TIME=$(kubectl get pod -l app=paladin -n paladin -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].lastTransitionTime}')
          # Improvement over the copied source job: the source only checks the
          # startup budget when both timestamps are non-empty, so an unreadable
          # timestamp silently passes a check that measured nothing. Invert it:
          # an empty timestamp is a hard failure.
          if [ -z "$START_TIME" ] || [ -z "$READY_TIME" ]; then
            echo "::error::Could not read pod start/ready timestamps (START_TIME='${START_TIME}' READY_TIME='${READY_TIME}')"
            exit 1
          fi
          START_EPOCH=$(date -d "$START_TIME" +%s)
          READY_EPOCH=$(date -d "$READY_TIME" +%s)
          STARTUP_TIME=$((READY_EPOCH - START_EPOCH))
          echo "Startup time: ${STARTUP_TIME} seconds"
          if [ "$STARTUP_TIME" -gt 30 ]; then
            echo "::error::Startup time (${STARTUP_TIME}s) exceeds the 30 second budget"
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Paladin Pods ==="
          kubectl get pods -n paladin
          echo "=== Paladin Logs ==="
          kubectl logs -l app=paladin -n paladin --tail=200 || true
          echo "=== Redis Logs ==="
          kubectl logs -l app=redis -n paladin --tail=100 || true
          echo "=== MinIO Logs ==="
          kubectl logs -l app=minio -n paladin --tail=100 || true
          echo "=== Events ==="
          kubectl get events -n paladin --sort-by='.lastTimestamp'

  # End-to-end tests with full Docker stack
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    # use this under normal behavior
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # use this for troubleshooting e2e tests
    # if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create environment file
        run: |
          cat > docker/.env << 'EOF'
          MINIO_ROOT_USER=e2euser
          MINIO_ROOT_PASSWORD=e2epassword123
          REDIS_PASSWORD=e2eredispass
          LLM_API_KEY=test-key
          EOF

      - name: Start full stack
        run: |
          docker compose -f docker/docker-compose.yml up -d
          sleep 30

      - name: Check service health
        run: |
          # Check Redis
          docker compose -f docker/docker-compose.yml exec -T redis redis-cli -a "${REDIS_PASSWORD:-changeme}" --no-auth-warning ping

          # Check MinIO
          curl -f http://localhost:9000/minio/health/live

          # Check application (if health endpoint exists)
          timeout 60 bash -c 'until curl -f http://localhost:8080/health 2>/dev/null; do sleep 2; done' || echo "App health check skipped"

      - name: Run end-to-end tests
        run: |
          # Run integration tests against the deployed test services (MinIO + Redis)
          # Tests are marked #[ignore] to skip in unit-test runs; --ignored opts them in here
          docker compose -f docker/docker-compose.test.yml run --rm integration-tests \
            cargo test file_storage_integration_tests --test lib -- --ignored --test-threads=1 --nocapture

      - name: Collect logs
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml logs > docker-logs.txt

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: docker-logs.txt

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v

  # Optional non-blocking regression signal for PRs and manual runs.
  benchmark-regression-signal:
    name: Benchmark Regression Signal (Non-Blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run critical-path benchmarks for signal
        run: |
          set -euo pipefail
          mkdir -p benchmark-signal
          LOG=benchmark-signal/criterion-output.log

          # The config benchmarks call `Settings::new()`, which requires a base
          # `config` file. `config.yml` is gitignored (it can hold secrets), so it
          # is absent in CI — seed it from the committed `config.test.yml` so the
          # benchmark can load settings. APP_ENV=test also overlays config.test.
          if [ ! -f config.yml ]; then
            cp config.test.yml config.yml
          fi

          {
            echo "# Benchmark regression signal run"
            echo "# commit: ${GITHUB_SHA}"
            echo "# timestamp: $(date -Iseconds)"
            echo "# APP_ENV=test"
            env APP_ENV=test cargo bench --bench config_benchmarks -- --noplot
            env APP_ENV=test cargo bench -p paladin-battalion --bench battalion_benchmarks -- --noplot
            env APP_ENV=test cargo bench -p paladin-memory --bench garrison_benchmarks -- --noplot
            env APP_ENV=test cargo bench -p paladin-llm --bench llm_serialization_benchmarks -- --noplot
          } | tee "$LOG"

      - name: Evaluate regression threshold
        run: |
          set -euo pipefail
          LOG=benchmark-signal/criterion-output.log
          SUMMARY=benchmark-signal/summary.md
          THRESHOLD=3
          REGRESSION_COUNT=$(grep -c "Performance has regressed\." "$LOG" || true)

          {
            echo "## Benchmark Regression Signal"
            echo ""
            echo "- Threshold: ${THRESHOLD} Criterion regression notices"
            echo "- Observed regressions: ${REGRESSION_COUNT}"
            echo "- Signal mode: non-blocking"
          } > "$SUMMARY"

          if [[ "$REGRESSION_COUNT" -gt "$THRESHOLD" ]]; then
            echo "::warning title=Benchmark Regression Signal::Detected ${REGRESSION_COUNT} regressions (threshold ${THRESHOLD})."
            exit 1
          fi

          echo "::notice title=Benchmark Regression Signal::Detected ${REGRESSION_COUNT} regressions (threshold ${THRESHOLD})."

      - name: Publish regression summary
        if: always()
        run: |
          if [ -f benchmark-signal/summary.md ]; then
            cat benchmark-signal/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark signal summary not produced (benchmarks did not complete)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload regression signal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-regression-signal
          path: benchmark-signal/

  # Publish dry-run: verify all crates are publishable (main branch only)
  publish-dry-run:
    name: Publish Dry Run
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # A single workspace-wide dry run packages and verifies every crate in
      # dependency order, resolving intra-workspace `version` requirements via
      # their `path` entries. Per-crate `cargo publish --dry-run -p <crate>`
      # cannot work on a version bump: the not-yet-published new version of each
      # sibling fails the `version = "X"` requirement of its dependents.
      - name: Dry run publish workspace
        run: cargo publish --workspace --dry-run
