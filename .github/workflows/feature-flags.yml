# Runs on a push to ANY branch (D-03). This filter previously named four
# prefixes (main/develop/release/feature) while real branch traffic used
# eight, so pushes to fix/, feat/, docs/, chore/, copilot/ and agent/
# branches never exercised this 14-job matrix at all. Enumerating a wider
# prefix list was rejected: the next unsanctioned prefix someone invents
# would be dark again, so the filter matches every branch instead of a
# maintained allowlist. Duplicate runs (one for `push`, one for
# `pull_request`) are collapsed by the `concurrency` group below rather
# than by dropping a trigger.
on:
  push:
    branches: [ '**' ]
  # `release/**` added: a PR targeting a release branch must exercise the
  # feature matrix too, not only PRs targeting main. `develop` was pruned
  # here (plan 15.1-09): the branch was retired in plan 15.1-07's trunk
  # cutover, and a trigger list naming a ref that no longer exists is
  # exactly the stale surface the trigger-policy register in
  # docs/src/contributing/branching-model.md exists to catch.
  pull_request:
    branches: [ main, 'release/**' ]
  workflow_dispatch:

concurrency:
  # `head_ref` is set only on pull_request events; on push it is empty and this
  # falls back to `ref`, so the push run and the PR run for one branch share a
  # group and the newer supersedes the older. This is what makes restoring the
  # `push:` trigger affordable for a matrix this wide.
  group: feature-flags-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  feature-matrix:
    name: Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "no-default-features"
            flags: "--no-default-features"
            description: "Core only (no optional features)"

          - name: "default"
            flags: ""
            description: "Default features (llm-openai)"

          - name: "all-features"
            flags: "--all-features"
            description: "All features enabled"

          - name: "full"
            flags: "--features full"
            description: "Full convenience flag"

          - name: "llm-openai"
            flags: "--no-default-features --features llm-openai"
            description: "OpenAI provider only"

          - name: "llm-anthropic"
            flags: "--no-default-features --features llm-anthropic"
            description: "Anthropic provider only"

          - name: "llm-deepseek"
            flags: "--no-default-features --features llm-deepseek"
            description: "DeepSeek provider only"

          - name: "llm-all"
            flags: "--no-default-features --features llm-all"
            description: "All LLM providers"

          - name: "web-server"
            flags: "--no-default-features --features web-server"
            description: "Web server subsystem"

          - name: "content-processing"
            flags: "--no-default-features --features content-processing"
            description: "Content processing subsystem"

          - name: "notifications"
            flags: "--no-default-features --features notifications"
            description: "Notifications subsystem"

          - name: "vision"
            flags: "--no-default-features --features vision"
            description: "Vision capabilities"

          - name: "redis-queue"
            flags: "--no-default-features --features redis-queue"
            description: "Redis queue adapter"

          - name: "s3-storage"
            flags: "--no-default-features --features s3-storage"
            description: "S3/MinIO storage adapter"

          - name: "cli"
            flags: "--no-default-features --features cli"
            description: "CLI module (isolated from library)"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # matrix.name differentiates 14 legs by feature-set string, not by
      # toolchain or lockfile -- the one input Swatinem/rust-cache@v2's
      # automatic job-based key cannot see (same `dtolnay/rust-toolchain@stable`
      # for every leg, so its default rustc-version-in-key component is
      # identical across all 14). Fed as the action's additional `key` input so
      # each feature-set leg keeps its own cache entry, matching what the
      # ${{ matrix.name }} key suffix on the block above already achieved.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Check (${{ matrix.description }})
        run: cargo check ${{ matrix.flags }}

      - name: Build (${{ matrix.description }})
        run: cargo build --workspace ${{ matrix.flags }}

      - name: Test (${{ matrix.description }})
        run: cargo test --workspace --lib ${{ matrix.flags }}

  # Dedicated job: verify that the library compiles and tests pass WITHOUT cli deps
  cli-isolation:
    name: CLI Isolation (library without cli feature)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check library (no-default-features, no cli)
        run: cargo check --lib --no-default-features

      - name: Run cli_isolation regression tests
        run: cargo test --test cli_isolation

      - name: Verify paladin binary requires the cli feature
        run: |
          if cargo build --bin paladin; then
            echo "ERROR: paladin binary built without --features cli; required-features gate is not enforced (ADR-0023)" >&2
            exit 1
          else
            echo "OK: paladin binary correctly failed to build without --features cli (required-features gate holds)"
          fi

      - name: Verify paladin-cli binary builds with cli feature
        run: cargo build --bin paladin-cli --features cli

  # Dedicated job (gap-closure plan 17-17, CR-01/17-REVIEW.md): the fourteen-leg
  # matrix's test step above is `cargo test --workspace --lib`, and `--lib` never
  # executes the `tests/unit/mod.rs` integration-test binary, so no matrix leg runs
  # `tests/unit/llm/provider_factory_test.rs`. `ci.yml`'s full-workspace run does
  # execute that binary but never adds `llm-all`, so it never compiles the six new
  # provider rows into the registry. The intersection -- the unit binary AND the
  # nine-row registry -- was therefore run by no CI job, which is why CR-01
  # reproduced locally against a live tree while every CI configuration stayed
  # green (17-REVIEW.md).
  llm-registry-unit-tests:
    name: LLM Registry Unit Tests (llm-all)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: llm-registry-unit-tests

      - name: Run unit test binary (llm-all)
        run: cargo test --test unit --features llm-all

  # Dedicated job (28-09, D-13b): the fourteen-leg matrix's test step above is
  # `cargo test --workspace --lib`, which never executes the `tests/lib.rs`
  # integration binary that `tests/integration/otel_transport_test.rs` is
  # compiled through (`tests/integration/mod.rs`'s `#[cfg(feature = "otel")]`
  # gate) -- so an `otel` matrix entry alone would build the feature but never
  # actually run its transport assertion against a real socket. This job
  # builds `--no-default-features --features otel` AND runs both the span-tree
  # shape tests (`otel_sink`'s own `#[cfg(test)]` module) and the transport
  # integration test in the SAME leg, giving D-13b's OTLP stub assertion a CI
  # home.
  otel-feature:
    name: OTel Feature (otel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: otel-feature

      - name: Check (otel)
        run: cargo check --no-default-features --features otel

      - name: Build (otel)
        run: cargo build --workspace --no-default-features --features otel

      # `--workspace`, not `-p paladin-ai`: a pre-existing, unrelated gap
      # (`paladin_builder.rs`'s own `#[cfg(test)]` module references
      # `paladin_llm::deepseek`/`anthropic` with no feature gate) only
      # surfaces when paladin-ai's `--lib` test target is compiled in
      # ISOLATION under `--no-default-features` -- `-p paladin-ai
      # --no-default-features --lib` fails to compile for that unrelated
      # reason even with NO otel feature involved (confirmed empirically,
      # 28-09; logged in `deferred-items.md`, out of this plan's scope
      # per the executor's scope-boundary rule). `--workspace` unifies
      # features across every workspace member the same way the existing
      # `no-default-features`/`all-features`/`full` matrix legs above
      # already do, which avoids it.
      - name: Run span-tree shape tests (otel)
        run: cargo test --workspace --no-default-features --features otel --lib infrastructure::telemetry::otel_sink

      - name: Run OTLP transport integration test (otel)
        run: cargo test --workspace --no-default-features --features otel --test lib -- otel_transport_test

  # Summary job to require all matrix builds pass
  feature-matrix-summary:
    name: Feature Matrix Summary
    runs-on: ubuntu-latest
    needs: [feature-matrix, cli-isolation, llm-registry-unit-tests, otel-feature]
    if: always()
    steps:
      - name: Check feature matrix results
        run: |
          if [[ "${{ needs.feature-matrix.result }}" == "success" && "${{ needs.cli-isolation.result }}" == "success" && "${{ needs.llm-registry-unit-tests.result }}" == "success" && "${{ needs.otel-feature.result }}" == "success" ]]; then
            echo "✅ All feature flag combinations passed"
            echo "✅ CLI isolation tests passed"
            echo "✅ LLM registry unit tests passed (llm-all)"
            echo "✅ OTel feature tests passed (otel)"
            exit 0
          else
            echo "❌ Some feature flag combinations failed"
            echo "feature-matrix: ${{ needs.feature-matrix.result }}"
            echo "cli-isolation: ${{ needs.cli-isolation.result }}"
            echo "llm-registry-unit-tests: ${{ needs.llm-registry-unit-tests.result }}"
            echo "otel-feature: ${{ needs.otel-feature.result }}"
            exit 1
          fi
