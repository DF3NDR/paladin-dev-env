# Pre-commit hook configuration for the Paladin workspace.
# Install with: make hooks   (wraps `pre-commit install` for commit + pre-push stages)
# Run manually with: pre-commit run --all-files
# See CONTRIBUTING.md for details and the --no-verify emergency override.

# Install both the commit-time and push-time hook stages from a single
# `pre-commit install` invocation.
default_install_hook_types:
  - pre-commit
  - pre-push

# Skip generated / vendored / build artifacts (most are already gitignored).
#
# .claude/ holds the vendored GSD toolchain (installed by
# `npx @opengsd/gsd-core@latest --claude --local`, see .devcontainer/post-create.sh).
# It is excluded for two reasons:
#   1. The formatting hooks rewrite its files, which invalidates the SHA-256
#      checksums recorded in .claude/gsd-file-manifest.json and breaks `gsd update`.
#   2. Those same manifest checksums are high-entropy strings that gitleaks
#      reports as `generic-api-key` false positives.
# Upstream owns this tree; re-run the installer to update it rather than editing.
exclude: |
  (?x)^(
    target/.*|
    flat/.*|
    \.claude/.*|
    .*\.lock|
    lcov\.info
  )$

repos:
  # --- General-purpose hygiene hooks ------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml          # Cargo.toml / deny.toml / audit.toml syntax
      - id: check-yaml          # config.yml / compose / workflow syntax
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1024]    # 1 MB limit to block accidental binaries
      - id: check-merge-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Rust files are governed by `cargo fmt`; excluding them here avoids an
        # oscillation between end-of-file-fixer and rustfmt on empty modules.
        exclude: \.rs$
      - id: end-of-file-fixer
        exclude: \.rs$

  # --- Secrets detection ------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Shell script linting ---------------------------------------------------
  # Uses shellcheck-py (vendors its own shellcheck binary) rather than the
  # upstream docker-based hook, so it works inside the devcontainer and in CI
  # without a Docker socket. `shellcheck` is also apt-installed in the dev image
  # for ad-hoc runs via `make lint-shell`.
  # Gated at --severity=warning: this catches the structural bugs that matter
  # (unclosed if/fi, missing shebangs) while leaving the ~12 pre-existing
  # style/info findings (mostly SC2086 quoting) as non-blocking.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # --- Rust workspace gates (run once per commit, not per file) ---------------
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (check)
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false
        always_run: true

      - id: cargo-clippy
        name: cargo clippy (workspace, -D warnings)
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        always_run: true

      # --- Pre-push gate: fast compile + unit-test subset ---------------------
      - id: cargo-build-push
        name: cargo build (workspace)
        entry: cargo build --workspace
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: cargo-test-lib-push
        name: cargo test (workspace lib/unit tests)
        entry: cargo test --workspace --lib
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: check-doc-examples
        name: cargo check (doc code examples)
        entry: ./scripts/check-doc-examples.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: check-doc-config
        name: validate doc YAML config snippets
        entry: ./scripts/check-doc-config.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      # This sits at pre-push, not pre-commit, for two reasons: GSD executor
      # commits bypass commit-stage hooks entirely, and the check costs ~95s,
      # which is tolerable once per push alongside the build + lib tests above
      # but not on every commit.
      - id: check-api-surface
        name: check public API surface vs baseline
        entry: ./scripts/check-api-surface.sh .project/current-exports.txt
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^(src|crates)/.*\.rs$|^Cargo\.toml$

      # Same reasoning as check-api-surface above: GSD executor commits bypass
      # commit-stage hooks entirely, and the rustdoc zero-warning bar (ADR-0033)
      # -- two full workspace `cargo doc` builds plus the doctest run -- costs
      # real time, tolerable once per push but not on every commit.
      - id: doc-check
        name: check rustdoc zero-warning bar (ADR-0033) + doctests
        entry: make doc-check
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^(src|crates)/.*\.rs$|^Cargo\.toml$

      # Same reasoning as doc-check above: GSD executor commits bypass
      # commit-stage hooks entirely, and this gate rebuilds the doctest
      # suite it depends on, so it rides at pre-push once per push rather
      # than on every commit.
      - id: check-api-examples
        name: check public API '# Examples' headings
        entry: make check-api-examples
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^(src|crates)/.*\.rs$|^Cargo\.toml$
