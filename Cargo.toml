[features]
# D-11 (amended 2026-08-17, option-b): the compiled default provider set is
# unchanged from the pre-ADR-0046 shape (openai + anthropic + deepseek) even
# though the llm-* flags below are now real gates rather than inert stubs.
# See ADR-0046 for the full reasoning and the deferred opt-in-posture question.
default = ["llm-openai", "llm-anthropic", "llm-deepseek"]
redis-queue = ["paladin-storage/redis-queue"]
s3-storage = ["paladin-storage/s3"]
openai-embeddings = ["paladin-llm/openai-embeddings"]
qdrant = ["qdrant-client", "paladin-memory/qdrant"]
integration-tests = []
live-api-tests = []  # Tests requiring real API keys (OpenAI, DeepSeek, Anthropic)

# LLM provider feature flags (ADR-0046): each flag forwards into the
# paladin-llm feature of the same name, so a `--no-default-features` build
# compiles no provider adapter at all.
llm-openai = ["paladin-llm/openai"]
llm-anthropic = ["paladin-llm/anthropic"]
llm-deepseek = ["paladin-llm/deepseek"]
llm-kimi = ["paladin-llm/kimi"]
llm-qwen = ["paladin-llm/qwen"]
llm-grok = ["paladin-llm/grok"]
llm-ollama = ["paladin-llm/ollama"]
llm-gemini = ["paladin-llm/gemini"]
llm-openai-compatible = ["paladin-llm/openai-compatible"]
llm-all = ["llm-openai", "llm-anthropic", "llm-deepseek", "llm-kimi", "llm-qwen", "llm-grok", "llm-ollama", "llm-gemini", "llm-openai-compatible"]

# Subsystem feature flags
# `vision` forwards into paladin-llm/vision (which itself depends on
# paladin-llm's own `openai` feature) rather than being pulled in
# unconditionally on the dependency line — see ADR-0046 Pitfall 2/T-17-36.
vision = ["paladin-llm/vision"]
content-processing = ["dep:paladin-content", "paladin-content/web-scraping", "paladin-content/rss", "paladin-content/news-api", "paladin-content/tiktoken", "paladin-content/llm", "paladin-memory/content-processing"]
web-server = ["dep:paladin-web", "dep:axum"]
notifications = ["dep:paladin-notifications", "paladin-notifications/email", "paladin-notifications/push", "paladin-notifications/system"]
# SQLite repositories are always available: `paladin-storage` is a non-optional
# dependency with its `sqlite` feature enabled (see [dependencies]).
storage-mysql = ["paladin-storage/mysql"]
# PostgreSQL `WaypointPort` adapter (ENG-05, D-01). Deliberately NOT part of
# `default` or `full`'s implicit set beyond this explicit passthrough -- see
# X-11.4: the default `paladin-ai` build must gain no Postgres driver.
storage-postgres = ["paladin-storage/postgres"]
storage = ["storage-mysql", "storage-postgres"]

# Redis-backed `NodeCachePort` adapter (Doc 04 FT-FR-18…20, D-27). Deliberately
# NOT part of `default`, `storage`, or `full`'s implicit set -- see X-11.4: the
# default `paladin-ai` build must gain no Redis driver beyond what `redis-queue`
# already opts in separately.
redis-cache = ["paladin-storage/redis-cache"]

# OTLP trace export (28-09, D-12/D-13). Deliberately NOT part of `default`
# or `full`'s implicit set -- see X-11.4: the default `paladin-ai` build
# must gain no OTel dependency.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

# CLI (binary and test tooling only — not compiled into the library)
cli = ["dep:clap", "dep:dialoguer", "dep:indicatif", "dep:console", "dep:serde_yaml", "dep:colored", "dep:comfy-table", "dep:paladin-eval", "dep:glob", "paladin-herald/table", "paladin-herald/color"]

# Convenience flag for enabling all optional features
full = ["llm-all", "content-processing", "web-server", "notifications", "storage", "vision", "redis-queue", "s3-storage", "openai-embeddings", "qdrant", "cli"]

# Statically build OpenSSL from source (via openssl-sys vendored). Used only by
# cross-compiled release binaries that lack a target-arch system libssl.
vendored-openssl = ["dep:openssl", "openssl/vendored"]

# Performance optimizations for Redis
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
overflow-checks = true
# Trim debuginfo to keep target/ from ballooning. "line-tables-only" preserves
# file/line info in backtraces on our own crates without the heavy
# type/variable debug data.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies almost never need to be stepped through — drop their debuginfo
# entirely. This is the single biggest lever against target/deps growth: the
# ~100-220M linked test binaries are mostly dependency debug sections.
debug = false

[profile.dev.build-override]
# Build scripts and proc macros (openssl-sys, utoipa-swagger-ui, serde_derive,
# sqlx-macros, ...) never need debuginfo.
debug = false

[profile.test]
opt-level = 0
# Must mirror [profile.dev]: an explicit `debug = true` here would keep every
# [[test]] binary fat regardless of the dev-profile trim. Test dependencies
# are built under the dev profile, so its package."*" override covers them
# (Cargo only permits package overrides on dev/release).
debug = "line-tables-only"
