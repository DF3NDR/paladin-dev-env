[workspace]
members = [".", "crates/*"]
# fixtures/codeql-probe is a deliberately-vulnerable CodeQL SAST evaluation
# fixture (Phase 18, D-07). It lives outside crates/ so the crates/* glob
# above cannot auto-include it, and carries its own [workspace] table so
# Cargo treats it as an independent workspace root; this exclude entry is
# defence in depth on top of both, keeping the fixture out of every
# workspace build, lint and coverage run.
exclude = ["fixtures/codeql-probe"]
resolver = "3"

[workspace.package]
# Single source of the workspace MSRV floor (D-10, X-11.2). Measured, not
# declared: `time` >= 0.3.47 (the RUSTSEC-2026-0009 fix) requires rustc 1.88,
# one release above the 1.87 that rmcp's `=2.1.0`-pinned `transport-child-process`
# feature forces via `process-wrap ^9.0`. See MIGRATION.md §9.3 for the full
# chain and the two rejected alternatives.
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1.88"
reqwest = { version = "0.12.4", features = ["json"] }
log = "0.4.21"
rand = "0.8"
base64 = "0.22"
futures = "0.3"
regex = "1.11.1"
paladin-core = { package = "paladin-ai-core", version = "0.9.0", path = "crates/paladin-core" }
paladin-ports = { version = "0.9.0", path = "crates/paladin-ports" }
paladin-battalion = { version = "0.9.0", path = "crates/paladin-battalion" }
paladin-herald = { version = "0.9.0", path = "crates/paladin-herald" }
paladin-llm = { version = "0.9.0", path = "crates/paladin-llm" }
paladin-memory = { version = "0.9.0", path = "crates/paladin-memory" }
paladin-storage = { version = "0.9.0", path = "crates/paladin-storage" }
paladin-notifications = { version = "0.9.0", path = "crates/paladin-notifications" }
paladin-content = { version = "0.9.0", path = "crates/paladin-content" }
paladin-web = { version = "0.9.0", path = "crates/paladin-web" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "migrate", "macros"] }
qdrant-client = { version = "1.14" }
# croner is already resolved in Cargo.lock at 2.2.0, pulled transitively via
# tokio-cron-scheduler -- pinning the same "2.2" here (D-38) promotes it to a
# direct dependency with no new package entering the graph (27-CONTEXT.md
# "Dependency head start", 2026-09-08).
croner = "2.2"
# chrono-tz is NOT in Cargo.lock today -- a genuinely new dependency (D-38's
# IANA timezone support), MSRV-verified at 1.88 (X-11.1, see MIGRATION.md
# §9.3).
chrono-tz = "0.10"

[package]
name = "paladin-ai"
version = "0.9.0"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
description = "Enterprise AI orchestration framework with multi-agent coordination patterns"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
license = "MIT OR Apache-2.0"
keywords = ["ai", "agents", "orchestration", "llm", "multi-agent"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://df3ndr.github.io/paladin-dev-env/"
# Package allowlist: the facade crate's root is the repo root, so without this
# `cargo package` swallows the whole repository (docs/ 32M, .planning/, .claude/,
# ...) and crates.io rejects the upload with 413 Payload Too Large (10 MiB max).
# tests/, examples/ and benches/ stay listed because the explicit [[test]]/
# [[example]]/[[bench]] targets below reference files in them.
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "benches/**",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

# X-10.6 deliberate-breaking suppression (RT-02, MIGRATION.md §9.2, Phase 26 plan 26-02).
# `Settings` gained the additive `agent_runtime: AgentRuntimeConfig` field with
# `#[serde(default)]`, so an absent `agent_runtime:` key resolves to a fully inert
# default and a v0.9 config boots byte-identically. It deliberately stays a
# constructible, NOT-`#[non_exhaustive]` struct for the same reason `PaladinResult`
# does (D-26): `Settings` implements `Default`, and cross-crate functional-update
# syntax (`..Default::default()`) is disallowed on `#[non_exhaustive]` structs, so
# marking it would break every such downstream construction site. Only full struct
# literals break; every in-tree one was migrated with the field.
# Register/remove this suppression only in the same commit as the matching
# MIGRATION.md §9.2 row and `.cargo/semver-checks-allowlist.toml` entry (kept
# set-equal by CI's `semver` job).
[package.metadata.cargo-semver-checks.lints]
constructible_struct_adds_field = "allow"

[lib]
name = "paladin"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
paladin-core = { workspace = true }
paladin-ports = { workspace = true }
paladin-battalion = { workspace = true }
paladin-herald = { workspace = true }
paladin-llm = { version = "0.9.0", path = "crates/paladin-llm", default-features = false, features = ["mock"] }
paladin-memory = { workspace = true, features = ["sqlite"] }
paladin-storage = { workspace = true, features = ["sqlite"] }
paladin-notifications = { workspace = true, optional = true }
paladin-content = { workspace = true, optional = true }
paladin-web = { workspace = true, optional = true }
# axum is only needed by the `paladin-server` binary (the `web-server` feature) to
# serve the agent router; gated so default builds don't pull it in.
axum = { version = "0.8.4", optional = true }
reqwest = { workspace = true, features = ["blocking", "stream"] }
# Arsenal MCP client engine (Phase 12.1 D-01/D-04, D-02/D-03): official rmcp
# SDK, already exact-pinned + approved elsewhere in this workspace
# (crates/audit-mcp). stdio (Plan 01) + Streamable-HTTP remote transport with
# bearer/header auth (Plan 02) — the `reqwest` feature enables rmcp's own
# rustls TLS backend, REQUIRED for HTTPS to a hosted server (Pitfall 1).
rmcp = { version = "=2.1.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
# HeaderName/HeaderValue for StreamableHttpClientTransportConfig::custom_headers()
# — same major version rmcp itself depends on (`http = "1"`), already resolved
# in this workspace's lockfile (no version-drift risk).
http = "1"
# rmcp's `StreamableHttpClient` trait is implemented for ITS OWN pinned
# `reqwest` major version (0.13.x) — distinct from this crate's existing
# `reqwest` dependency above (0.12.x, used by unrelated existing HTTP client
# code). Aliased as `reqwest_mcp` so both major versions coexist without a
# `[dependencies]` name collision; Cargo unifies this edge with rmcp's own
# `reqwest = "0.13.2"` requirement into a single compiled instance, so
# `reqwest_mcp::Client` IS the exact type rmcp's `StreamableHttpClientTransport`
# impl is written against.
reqwest_mcp = { package = "reqwest", version = "0.13", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
# D-26 (RT-05, plan 26-12): direct facade dependency for `execute_structured<T>`'s
# schema derivation (`schemars::schema_for!`), landing in plan 26-17. Pinned to
# the same minor version already resolved via `rmcp 2.1.0` in `Cargo.lock`
# (1.2.1), so this adds ZERO new packages to the dependency graph -- confirmed
# by `cargo tree -i schemars` showing exactly two versions (0.9.0 via
# serde_with, 1.2.1 via both rmcp and this direct edge). No cargo feature added.
schemars = "1.2"

tokio = { workspace = true }
tokio-util = "0.7"
dotenv = "0.15.0"
env_logger = "0.11.3"
log = { workspace = true }
config = "0.15.11"
lazy_static = "1.4.0"
tempfile = "3.10.1"
uuid = { workspace = true, features = ["fast-rng", "macro-diagnostics"] }
url = {version = "2.5.2", features = ["serde"]}
chrono = { workspace = true }
thiserror = { workspace = true }
murmur3 = "0.5.2"
lock_api = "0.4.12"
once_cell = "1.19.0"
regex = "1.11.1"
urlencoding = "2.1.3"
sqlx = { workspace = true }
sha2 = "0.10.9"
# HMAC-SHA256 webhook delivery signing (PLAT-FR-15, D-41). Already resolved
# transitively at 0.12.1 in Cargo.lock (pulled in via an existing crypto
# dependency) -- this promotes it to a direct facade dependency with no new
# package entering the graph, mirroring `sha2`'s own placement immediately
# above (facade-only, not a `[workspace.dependencies]` entry).
hmac = "0.12"
blake3 = "1.8.2"
toml = "0.8.23"
md5 = "0.8.0"
async-trait = { workspace = true }
futures = "0.3.31"
bytes = "1.10.1"
mime_guess = "2.0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5.3"
clap = { version = "4.5.40", features = ["derive", "cargo", "env"], optional = true }
petgraph = "0.6"
rand = "0.8"
colored = { version = "2.1", optional = true }
comfy-table = { version = "7.1", optional = true }
serde_yaml = { version = "0.9", optional = true }
indicatif = { version = "0.17", optional = true }
console = { version = "0.15", optional = true }
dialoguer = { version = "0.11", optional = true }
# D-33 (plan 28-12): `paladin-cli eval run` builds a `ScenarioRunner`
# directly. Optional, `cli`-feature-gated only -- the facade's DEFAULT build
# (no `cli` feature) gains no edge to this crate; the `evals` `[[test]]`
# target's OWN need for it (independent of `cli`) is the separate,
# unconditional `[dev-dependencies]` entry below.
paladin-eval = { version = "0.9.0", path = "crates/paladin-eval", optional = true }
# `paladin-cli eval run`'s own glob matching over its `<glob>` argument --
# the SAME "0.3.4" pin `crates/paladin-eval/Cargo.toml` already resolved, so
# this is a new EDGE on an already-resolved package, never a new package in
# the lock file.
glob = { version = "0.3.4", optional = true }
qdrant-client = { workspace = true, optional = true }
base64 = "0.22"
# Encryption dependencies for Sentinel Vision System (Epic 13, Task 11.0)
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
tokio-cron-scheduler = "0.13"
# Optional, only enabled via the `vendored-openssl` feature so cross-compiled
# release binaries (e.g. aarch64 via `cross`) statically build OpenSSL from
# source instead of requiring a target-arch system libssl. Not enabled by
# default; native and Docker builds keep using the system OpenSSL.
openssl = { version = "0.10", optional = true }

# OTLP trace export (28-09, D-12/D-13, X-11.4): all three optional, gated by
# the `otel` feature declared below -- absent from `default` and from
# `full`'s explicit member list, mirroring the `storage-postgres`/
# `redis-cache` precedent. `default-features = false` on each: only the
# `trace` signal is used (no metrics/logs export), and
# `opentelemetry-otlp`'s DEFAULT feature set pulls in reqwest's *blocking*
# client feature, which is NOT the async client D-12 specifies --
# `reqwest-client` (the async one) is enabled explicitly instead.
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"], optional = true }
# `reqwest-client` needs an ASYNC `reqwest` client at the SAME major version
# `opentelemetry-http` depends on internally (0.13.x) -- not this crate's
# own default `reqwest` line above (0.12.x). `reqwest_mcp` (below, an
# existing unconditional dependency for the Arsenal MCP client) already
# resolves to that exact 0.13.x line, so `otel_sink.rs` reuses
# `reqwest_mcp::Client` for its no-redirect OTLP HTTP client rather than
# declaring a second reqwest-0.13 alias here -- one compiled `reqwest`
# 0.13.x unit serves both, not two.
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-client", "trace"], optional = true }

[dev-dependencies]
mockito = "1.7.0"
tempfile = "3.0"
testcontainers = "0.24.0"
testcontainers-modules = { version = "0.12.1", features = ["minio"] }
tokio-test = "0.4"
proptest = "1.4"
serial_test = "3.2.0"
criterion = { version = "0.5", features = ["async_tokio"] }
insta = "1.34"
redis = { version = "0.32.2", features = ["aio", "tokio-comp"] }
# Integration test dependencies (gated by integration-tests feature)
wiremock = "0.6"
# Phase 12.1 Plan 04 (SC2 hermetic proof): stand up a REAL in-process,
# spec-strict Streamable-HTTP MCP server via axum + rmcp's OWN server-side
# transport feature -- the identical pattern rmcp's own test suite
# (tests/test_streamable_http_*.rs) uses to test its client against its
# server. dev-only: the workspace's `resolver = "2"` feature resolver keeps
# these extra rmcp features (and the `axum` dependency below) out of the
# production `cargo build -p paladin-ai` artifact -- they are unified into
# the compiled `rmcp`/`axum` units only when building test targets.
rmcp = { version = "=2.1.0", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
] }
axum = "0.8.4"
# `paladin-server.rs`'s own `#[cfg(test)]` module (Phase 24 Plan 11, HITL-05)
# drives the thread/agent routers directly via `tower::util::oneshot`,
# mirroring `paladin-web`'s own test convention -- dev-only, unified with
# `paladin-web`'s pinned `tower = "0.5"` by the workspace resolver.
tower = { version = "0.5", features = ["util"] }
# `src/application/services/run/tracer_e2e.rs` (Phase 27, Task 3, D-11) is
# the only crate that sees the engine, the queue adapter and the HTTP
# router at once, and mounts `paladin-web`'s `run_router` over a real
# `WarEngine` via `tower::util::oneshot` -- the same pattern as
# `paladin-server.rs`'s own test module above. `paladin-web` is normally an
# OPTIONAL runtime dependency (the `web-server` feature, `[dependencies]`
# above); this unconditional dev-dependency entry is what makes it
# available to `cargo test -p paladin-ai --lib` with no feature flags,
# mirroring how `axum`/`tower` above are already dev-only-unconditional.
paladin-web = { workspace = true }
# `src/application/services/run/schedule/tests.rs` (Phase 27, plan 27-11,
# D-37) needs `tokio::time::pause` to freeze the tick loop's own `interval`
# under `schedule_restart_exactly_once`/`two_services_one_tick_exactly_one_fire`
# -- a feature addition to the already-`{ workspace = true }`-pinned `tokio`
# runtime dependency above, not a new package, mirroring
# `crates/paladin-battalion/Cargo.toml`'s identical extra-feature dev-dependency
# precedent.
tokio = { workspace = true, features = ["test-util"] }
# `opentelemetry_sdk::trace::InMemorySpanExporter` (28-09, D-13a) -- the
# `[dependencies]` entry above is `optional = true` behind the `otel`
# feature and deliberately does NOT enable `testing` (a dev-only need, per
# X-11.4, must not leak into the production `otel` feature's dependency
# set); this dev-dependency entry adds ONLY that feature for test builds.
# `src/infrastructure/telemetry/otel_sink.rs`'s own tests are still gated
# `#[cfg(feature = "otel")]`, so this crate is compiled for test binaries
# but never actually exercised unless `--features otel` is also passed --
# mirroring `paladin-web`/`tower` above, this is a KNOWN, accepted
# dev-build-only widening: `cargo tree` run against a TEST target (not a
# plain `cargo build`) will show it regardless of `otel`; the `otel`
# feature gate is what keeps it out of the compiled `paladin` library/
# binary artifacts (X-11.4's actual scope), recorded in 28-09-SUMMARY.md.
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
# `tests/integration/otel_transport_test.rs` (28-09 Task 2, D-13b) decodes
# the OTLP/HTTP protobuf body an axum stub captures, to assert the
# resource's `service.name`. Both crates are ALREADY resolved transitively
# via `opentelemetry-otlp`'s `http-proto` feature (`[dependencies]` above)
# whenever `--features otel` is passed -- this dev-dependency entry adds no
# new package, only names them directly for the test file to `use`. Same
# `gen-tonic-messages`/`trace` feature pair `opentelemetry-otlp`'s own
# `http-proto` feature already requests (no `tonic`/gRPC).
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "trace"] }
prost = "0.14"
# D-32: the `evals` harness target (`tests/evals.rs`) needs `ScenarioRunner`
# unconditionally, independent of the `cli` feature -- `cargo test --test
# evals` must work with no `--features` at all. paladin-eval's own default
# build depends downward only (paladin-core/ports/battalion/llm-mock/storage-
# sqlite), never on this facade (D-27) -- this is a one-way dev-only edge.
paladin-eval = { version = "0.9.0", path = "crates/paladin-eval" }

