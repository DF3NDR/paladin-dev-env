[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1.88"
reqwest = { version = "0.12.4", features = ["json"] }
log = "0.4.21"
rand = "0.8"
base64 = "0.22"
futures = "0.3"
regex = "1.11.1"
paladin-core = { package = "paladin-ai-core", version = "0.5.1", path = "crates/paladin-core" }
paladin-ports = { version = "0.5.1", path = "crates/paladin-ports" }
paladin-battalion = { version = "0.5.1", path = "crates/paladin-battalion" }
paladin-herald = { version = "0.5.1", path = "crates/paladin-herald" }
paladin-llm = { version = "0.5.1", path = "crates/paladin-llm" }
paladin-memory = { version = "0.5.1", path = "crates/paladin-memory" }
paladin-storage = { version = "0.5.1", path = "crates/paladin-storage" }
paladin-notifications = { version = "0.5.1", path = "crates/paladin-notifications" }
paladin-content = { version = "0.5.1", path = "crates/paladin-content" }
paladin-web = { version = "0.5.1", path = "crates/paladin-web" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "json", "migrate"] }
qdrant-client = { version = "1.14" }

[package]
name = "paladin-ai"
version = "0.5.1"
edition = "2024"
authors = ["Am0rfu5"]
description = "Enterprise AI orchestration framework with multi-agent coordination patterns"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
license = "MIT"
keywords = ["ai", "agents", "orchestration", "llm", "multi-agent"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://df3ndr.github.io/paladin-dev-env/"

[lib]
name = "paladin"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
paladin-core = { workspace = true }
paladin-ports = { workspace = true }
paladin-battalion = { workspace = true }
paladin-herald = { workspace = true }
paladin-llm = { version = "0.5.1", path = "crates/paladin-llm", default-features = false, features = ["openai", "anthropic", "deepseek", "mock", "vision"] }
paladin-memory = { workspace = true, features = ["sqlite"] }
paladin-storage = { workspace = true, features = ["sqlite"] }
paladin-notifications = { workspace = true, optional = true }
paladin-content = { workspace = true, optional = true }
paladin-web = { workspace = true, optional = true }
# axum is only needed by the `paladin-server` binary (the `web-server` feature) to
# serve the agent router; gated so default builds don't pull it in.
axum = { version = "0.8.4", optional = true }
reqwest = { workspace = true, features = ["blocking", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }

structopt = "0.3"
tokio = { workspace = true }
tokio-util = "0.7"
dotenv = "0.15.0"
env_logger = "0.11.3"
log = { workspace = true }
config = "0.15.11"
lazy_static = "1.4.0"
tempfile = "3.10.1"
uuid = { workspace = true, features = ["fast-rng", "macro-diagnostics"] }
url = {version = "2.5.2", features = ["serde"]}
chrono = { workspace = true }
thiserror = { workspace = true }
murmur3 = "0.5.2"
lock_api = "0.4.12"
once_cell = "1.19.0"
regex = "1.11.1"
urlencoding = "2.1.3"
sqlx = { workspace = true }
sha2 = "0.10.9"
blake3 = "1.8.2"
toml = "0.8.23"
md5 = "0.8.0"
async-trait = { workspace = true }
futures = "0.3.31"
bytes = "1.10.1"
mime_guess = "2.0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5.3"
clap = { version = "4.5.40", features = ["derive", "cargo", "env"], optional = true }
petgraph = "0.6"
rand = "0.8"
colored = "2.1"
comfy-table = "7.1"
serde_yaml = { version = "0.9", optional = true }
indicatif = { version = "0.17", optional = true }
console = { version = "0.15", optional = true }
dialoguer = { version = "0.11", optional = true }
qdrant-client = { workspace = true, optional = true }
base64 = "0.22"
# Encryption dependencies for Sentinel Vision System (Epic 13, Task 11.0)
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
tokio-cron-scheduler = "0.13"
# Optional, only enabled via the `vendored-openssl` feature so cross-compiled
# release binaries (e.g. aarch64 via `cross`) statically build OpenSSL from
# source instead of requiring a target-arch system libssl. Not enabled by
# default; native and Docker builds keep using the system OpenSSL.
openssl = { version = "0.10", optional = true }

[dev-dependencies]
mockito = "1.7.0"
tempfile = "3.0"
testcontainers = "0.24.0"
testcontainers-modules = { version = "0.12.1", features = ["minio"] }
tokio-test = "0.4"
proptest = "1.4"
serial_test = "3.2.0"
criterion = { version = "0.5", features = ["async_tokio"] }
insta = "1.34"
redis = { version = "0.32.2", features = ["aio", "tokio-comp"] }
# Integration test dependencies (gated by integration-tests feature)
wiremock = "0.6"

# Integration test configuration
[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[[test]]
name = "system_log_integration"
path = "tests/integration/system_log_integration_test.rs"

[[test]]
name = "paladin_garrison_integration"
path = "tests/integration/paladin_garrison_integration_test.rs"

[[test]]
name = "citadel_integration"
path = "tests/integration/citadel_integration_test.rs"

[[test]]
name = "openai_embedding_integration"
path = "tests/integration/openai_embedding_tests.rs"
required-features = ["openai-embeddings"]

[[test]]
name = "in_memory_sanctum_integration"
path = "tests/integration/in_memory_sanctum_tests.rs"

[[test]]
name = "qdrant_sanctum_integration"
path = "tests/integration/qdrant_sanctum_tests.rs"
required-features = ["qdrant"]

[[test]]
name = "rag_integration"
path = "tests/integration/rag_integration_tests.rs"
required-features = ["qdrant"]

[[test]]
name = "vision_integration"
path = "tests/integration/vision_integration_test.rs"
required-features = ["vision", "llm-openai", "llm-anthropic"]

[[test]]
name = "cli"
path = "tests/cli/mod.rs"
required-features = ["cli"]

[[test]]
name = "cli_isolation"
path = "tests/cli_isolation_test.rs"

[[example]]
name = "vision_analysis"
path = "examples/vision_analysis.rs"
required-features = ["vision", "llm-openai"]

[[example]]
name = "vision_battalion"
path = "examples/vision_battalion.rs"
required-features = ["vision", "llm-openai"]

[[example]]
name = "document_processing"
path = "examples/document_processing.rs"
required-features = ["content-processing"]

[[bin]]
name = "paladin"
path = "src/main.rs"

[[bin]]
name = "paladin-cli"
path = "src/bin/paladin-cli.rs"
required-features = ["cli"]

[[bin]]
name = "paladin-server"
path = "src/bin/paladin-server.rs"
required-features = ["web-server"]

[[bench]]
name = "config_benchmarks"
harness = false

[features]
default = ["llm-openai"]
redis-queue = ["paladin-storage/redis-queue"]
s3-storage = ["paladin-storage/s3"]
openai-embeddings = ["paladin-llm/openai-embeddings"]
qdrant = ["qdrant-client", "paladin-memory/qdrant"]
integration-tests = []
live-api-tests = []  # Tests requiring real API keys (OpenAI, DeepSeek, Anthropic)

# LLM provider feature flags
llm-openai = []
llm-anthropic = []
llm-deepseek = []
llm-all = ["llm-openai", "llm-anthropic", "llm-deepseek"]

# Subsystem feature flags
vision = []
content-processing = ["dep:paladin-content", "paladin-content/web-scraping", "paladin-content/rss", "paladin-content/news-api", "paladin-content/tiktoken", "paladin-content/llm", "paladin-memory/content-processing"]
web-server = ["dep:paladin-web", "dep:axum"]
notifications = ["dep:paladin-notifications", "paladin-notifications/email", "paladin-notifications/push", "paladin-notifications/system"]
# SQLite repositories are always available: `paladin-storage` is a non-optional
# dependency with its `sqlite` feature enabled (see [dependencies]).
storage-mysql = ["paladin-storage/mysql"]
storage = ["storage-mysql"]

# CLI (binary and test tooling only — not compiled into the library)
cli = ["dep:clap", "dep:dialoguer", "dep:indicatif", "dep:console", "dep:serde_yaml"]

# Convenience flag for enabling all optional features
full = ["llm-all", "content-processing", "web-server", "notifications", "storage", "vision", "redis-queue", "s3-storage", "openai-embeddings", "qdrant", "cli"]

# Statically build OpenSSL from source (via openssl-sys vendored). Used only by
# cross-compiled release binaries that lack a target-arch system libssl.
vendored-openssl = ["dep:openssl", "openssl/vendored"]

# Performance optimizations for Redis
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.test]
opt-level = 0
debug = true
