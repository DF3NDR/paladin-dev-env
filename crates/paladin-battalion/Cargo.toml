[package]
name = "paladin-battalion"
version = "0.9.0"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
license = "MIT OR Apache-2.0"
description = "Multi-agent orchestration runtime for the Paladin framework — Formation, Phalanx, Campaign, Chain of Command, Conclave, Council, Grove, Maneuver, Commander"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "agents", "orchestration", "multi-agent", "workflow"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-battalion"

[dependencies]
paladin-core  = { package = "paladin-ai-core", version = "0.9.0", path = "../paladin-core" }
paladin-ports = { version = "0.9.0", path = "../paladin-ports" }
tokio         = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
uuid          = { workspace = true }
log           = { workspace = true }
chrono        = { workspace = true }
futures       = "0.3.31"
rand          = "0.8"
tokio-util    = "0.7"
petgraph      = "0.6"
regex         = "1.11.1"
# The node-cache key digest (`engine::cache_key`, plan 25-13, D-28): the
# same blake3 `paladin-core`'s `GraphFingerprint` already hashes with, at
# the same pinned version -- a new dependency EDGE on an already-resolved
# workspace package, never a new package in the lock file.
blake3        = "1.8.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
# `test-util` is NOT part of the workspace `tokio` feature set (`full` does
# not imply it, deliberately -- it exists so a non-test build never links
# tokio's fake-clock machinery). Added here, dev-dependencies-only, so
# `#[tokio::test(start_paused = true)]` (`engine::retry`'s paused-clock
# tests, Doc 04 plan 25-01) can pause/auto-advance the runtime's virtual
# clock. A feature addition to the ALREADY-declared workspace `tokio`
# dependency, not a new dependency (RESEARCH.md's "Don't Hand-Roll" note:
# `tokio::time::pause` is the tool, never a fake-clock crate).
tokio = { workspace = true, features = ["test-util"] }
# In-memory WaypointPort fixture for the engine module's own unit tests
# (Phase 22 Plan 01). No cycle: paladin-storage depends on paladin-core +
# paladin-ports only, never on paladin-battalion.
paladin-storage = { version = "0.9.0", path = "../paladin-storage" }
# MockLlmAdapter for LlmDecisionEvaluator / Commander StrategySelection::Semantic
# tests (CF-05, Phase 23 Plan 03). No cycle: it depends only on paladin-core +
# paladin-ports, never on paladin-battalion.
paladin-llm = { version = "0.9.0", path = "../paladin-llm" }

[[bench]]
name = "battalion_benchmarks"
harness = false
