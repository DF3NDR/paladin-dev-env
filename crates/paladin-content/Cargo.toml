[package]
name = "paladin-content"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["Am0rfu5"]
description = "Content processing adapters and use-case services for the Paladin framework"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "content", "ingestion", "analysis", "processing"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-content"

[lib]
doctest = false

[features]
web-scraping = ["dep:scraper"]
rss          = ["dep:rss"]
news-api     = []
tiktoken     = ["dep:tiktoken-rs"]
llm          = ["dep:paladin-llm"]

[dependencies]
paladin-core  = { package = "paladin-ai-core", version = "0.9.0", path = "../paladin-core" }
paladin-ports = { version = "0.9.0", path = "../paladin-ports" }
paladin-llm   = { version = "0.9.0", path = "../paladin-llm", optional = true }
async-trait   = { workspace = true }
chrono        = { workspace = true }
futures       = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
uuid          = { workspace = true }
reqwest       = { workspace = true, features = ["blocking"] }
regex         = { workspace = true }
url           = { version = "2.5.2", features = ["serde"] }
urlencoding   = "2.1.3"
pdf-extract   = { version = "0.7" }
scraper       = { version = "0.23.1", optional = true }
rss           = { version = "2.0", optional = true }
tiktoken-rs   = { version = "0.6.0", optional = true }

[dev-dependencies]
tempfile = "3.0"
mockito  = "1.7.0"
