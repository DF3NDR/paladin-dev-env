[package]
name = "paladin-ai-core"
version = "0.10.1"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
license = "MIT OR Apache-2.0"
description = "Pure domain types for the Paladin framework — zero infrastructure dependencies"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "agents", "framework", "orchestration", "domain"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-ai-core"

[lib]
name = "paladin_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
sha2 = "0.10.9"
blake3 = "1.8.2"
petgraph = "0.6"
murmur3 = "0.5.2"
url = { version = "2.5.2", features = ["serde"] }
regex = "1.11.1"
futures = "0.3.31"

[dev-dependencies]
# Test-only: seeded shuffling for Battlefield::merge's ENG-FR-08 determinism
# test (20 shuffled-input iterations must produce byte-identical output).
# Never a production dependency — paladin-core stays dependency-pure at
# runtime; `rand` is already a vetted workspace dependency used elsewhere
# (paladin-battalion, paladin-llm).
rand = { workspace = true }

# X-10.6 deliberate-breaking suppression (D-04, MIGRATION.md §9.2, FT-01, Phase 25).
# `BattalionError` gained the `Node(NodeError)` variant (FT-FR-02, D-06) and
# `PaladinError` gained the structured `LlmFailure` variant and a new
# `transience()` method (D-02); both enums are marked `#[non_exhaustive]` so
# this typed-classification error taxonomy can grow without a semver-major
# bump. Register/remove this suppression only in the same commit as the
# matching MIGRATION.md §9.2 rows and `.cargo/semver-checks-allowlist.toml`
# entries (kept set-equal by CI's `semver` job).
#
# FT-05 / FT-FR-17 (D-26, Phase 25 plan 25-08): `PaladinResult` gained the
# additive `served_by: Option<String>` field and deliberately stays a
# constructible, NOT-`#[non_exhaustive]` struct -- cross-crate
# functional-update syntax is disallowed on `#[non_exhaustive]` structs, so
# marking it would break every `..Default::default()` construction site
# downstream. Only full struct literals break; the in-tree ones were migrated
# in the same commit that added the field.
#
# RT-03 / RT-FR-12 (D-17, Phase 26 plan 26-07): `GarrisonEntry` gained the
# persisted `is_summary: bool` field (`#[serde(default)]`) and is marked
# `#[non_exhaustive]` -- it has no `Default`, so there is no functional-update
# site to preserve, and construction goes through `new`/`with_metadata`/
# `with_token_count`/`summary` rather than a struct literal.
#
# ACCT-01 / ACCT-02 (D-05, D-09, Phase 31 plans 31-01/31-02, MIGRATION.md
# §9.2): `TokenUsage::from_total` was deleted outright (fires
# `inherent_method_missing`) and `PaladinResult`'s `token_count` field was
# replaced by `usage: TokenUsage` (fires `struct_pub_field_missing`, ADDING to
# the pre-existing `constructible_struct_adds_field` suppression that already
# covers this crate/type pair). Both lint ids were derived empirically via
# `cargo semver-checks check-release --package paladin-ai-core
# --default-features --baseline-version 0.9.0` (D-27), never guessed.
#
# LEGACY-01..04 (ADR-0059, D-00c, D-27, Phase 44 plan 44-11): the legacy
# Battalion definitions were deleted outright, with no deprecated shim, and
# the diagnostic (cargo-semver-checks 0.50.0 against the published 0.10.1,
# `--release-type minor`, this table's allow lines disabled, restored
# byte-for-byte) fired these lints for them. The three already-allowed lints
# above cover the removed per-run timeout, retry and error-strategy fields and
# their builders on the Battalion and Conclave configs (inherent_method_missing,
# struct_pub_field_missing) and the added per-attempt policy field
# (constructible_struct_adds_field). Three further lints are new here:
# struct_missing (the legacy Battalion retry policy type and the legacy
# node-error summary type), enum_missing (the legacy Battalion error-strategy
# enum) and enum_variant_missing (the whole-run timeout variant of the
# Battalion and Conclave error enums, and the string-carrying LLM variant of
# the Paladin error enum). Each has a matching MIGRATION.md section 9.2 row
# and `.cargo/semver-checks-allowlist.toml` entry, kept set-equal by CI's
# `semver` job; every in-tree site migrated in the same commit series.
#
# ENTITY-01..05 (ADR-0060, D-27, Phase 48 plan 48-07, MIGRATION.md section 9.2):
# the base entity wrapper was renamed and the citadel placeholder types were
# unified, with no deprecated shim. The same diagnostic (cargo-semver-checks
# 0.50.0 against the published 0.10.1, `--release-type minor`,
# `--default-features`, this table's allow lines disabled and restored
# byte-for-byte) fired these lints for the Phase 48 items: struct_missing and
# module_missing (the wrapper's old struct and module, and the old
# version-service module with its structs), enum_missing (the version family's
# enums and the citadel module's placeholder status enum), trait_missing (the
# old version-repository trait), struct_missing again for the citadel
# module's placeholder data struct, and struct_pub_field_missing plus
# constructible_struct_adds_field for the two content-wrapper fields
# (ContentItem and PromptItem). Two lints are new here: module_missing and
# trait_missing. The already-allowed struct_missing, enum_missing,
# struct_pub_field_missing and constructible_struct_adds_field cover the rest.
# Each Phase 48 lint has a matching MIGRATION.md section 9.2 row and
# `.cargo/semver-checks-allowlist.toml` entry, kept set-equal by CI's
# `semver` job; every in-tree site migrated in plans 48-03, 48-04 and 48-05.
#
# REASON-01 (D-00b, D-00e, Phase 51 plan 51-07): `PaladinData` gained the
# per-agent `reasoning_effort` and `reasoning_fallback` fields
# (`#[serde(default, skip_serializing_if = "Option::is_none")]`) and stays
# constructible and NOT `#[non_exhaustive]`, so cross-crate `..Default::default()`
# keeps working. The expected lint is `constructible_struct_adds_field`, already
# allowed above; it is UNMEASURED here (cargo-semver-checks is absent in this
# container) and plan 51-14 measures it. The MIGRATION.md section 9.2 row and the
# `.cargo/semver-checks-allowlist.toml` entry are registered in the same commit
# as the fields; every in-tree full literal named both fields in that commit.
[package.metadata.cargo-semver-checks.lints]
enum_marked_non_exhaustive = "allow"
constructible_struct_adds_field = "allow"
inherent_method_missing = "allow"
struct_pub_field_missing = "allow"
struct_marked_non_exhaustive = "allow"
struct_missing = "allow"
enum_missing = "allow"
enum_variant_missing = "allow"
module_missing = "allow"
trait_missing = "allow"
