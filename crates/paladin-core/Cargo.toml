[package]
name = "paladin-ai-core"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["Am0rfu5"]
license = "MIT OR Apache-2.0"
description = "Pure domain types for the Paladin framework — zero infrastructure dependencies"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "agents", "framework", "orchestration", "domain"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-ai-core"

[lib]
name = "paladin_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
sha2 = "0.10.9"
blake3 = "1.8.2"
petgraph = "0.6"
murmur3 = "0.5.2"
url = { version = "2.5.2", features = ["serde"] }
regex = "1.11.1"
futures = "0.3.31"

[dev-dependencies]
# Test-only: seeded shuffling for Battlefield::merge's ENG-FR-08 determinism
# test (20 shuffled-input iterations must produce byte-identical output).
# Never a production dependency — paladin-core stays dependency-pure at
# runtime; `rand` is already a vetted workspace dependency used elsewhere
# (paladin-battalion, paladin-llm).
rand = { workspace = true }
