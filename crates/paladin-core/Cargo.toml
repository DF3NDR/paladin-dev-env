[package]
name = "paladin-ai-core"
version = "0.9.0"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
license = "MIT OR Apache-2.0"
description = "Pure domain types for the Paladin framework — zero infrastructure dependencies"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "agents", "framework", "orchestration", "domain"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-ai-core"

[lib]
name = "paladin_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
sha2 = "0.10.9"
blake3 = "1.8.2"
petgraph = "0.6"
murmur3 = "0.5.2"
url = { version = "2.5.2", features = ["serde"] }
regex = "1.11.1"
futures = "0.3.31"

[dev-dependencies]
# Test-only: seeded shuffling for Battlefield::merge's ENG-FR-08 determinism
# test (20 shuffled-input iterations must produce byte-identical output).
# Never a production dependency — paladin-core stays dependency-pure at
# runtime; `rand` is already a vetted workspace dependency used elsewhere
# (paladin-battalion, paladin-llm).
rand = { workspace = true }

# X-10.6 deliberate-breaking suppression (D-04, MIGRATION.md §9.2, FT-01, Phase 25).
# `BattalionError` gained the `Node(NodeError)` variant (FT-FR-02, D-06) and
# `PaladinError` gained the structured `LlmFailure` variant and a new
# `transience()` method (D-02); both enums are marked `#[non_exhaustive]` so
# this typed-classification error taxonomy can grow without a semver-major
# bump. Register/remove this suppression only in the same commit as the
# matching MIGRATION.md §9.2 rows and `.cargo/semver-checks-allowlist.toml`
# entries (kept set-equal by CI's `semver` job).
[package.metadata.cargo-semver-checks.lints]
enum_marked_non_exhaustive = "allow"
