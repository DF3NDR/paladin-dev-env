[package]
name = "paladin-herald"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["Am0rfu5"]
license = "MIT OR Apache-2.0"
description = "Herald output-formatter adapters for the Paladin framework (JSON, Markdown, Table)"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "herald", "formatting", "output", "cli"]
categories = ["development-tools", "command-line-interface"]
documentation = "https://docs.rs/paladin-herald"

[lib]
doctest = false

[features]
default = []
table = ["dep:comfy-table"]
color = ["dep:colored"]

[dependencies]
paladin-core = { package = "paladin-ai-core", version = "0.9.0", path = "../paladin-core" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
comfy-table = { version = "7.1", optional = true }
colored = { version = "2.1", optional = true }

[dev-dependencies]
paladin-ports = { version = "0.9.0", path = "../paladin-ports" }
uuid = { workspace = true }
