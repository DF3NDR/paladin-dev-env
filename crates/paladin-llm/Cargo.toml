[package]
name = "paladin-llm"
version = "0.10.1"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
license = "MIT OR Apache-2.0"
description = "LLM provider adapters for the Paladin framework — major hosted providers plus a generic OpenAI-compatible adapter for any other endpoint; see README for the full list"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "llm", "openai-compatible", "gemini", "agents"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-llm"

[lib]
doctest = false

[features]
default = ["openai", "mock"]
openai = ["dep:reqwest"]
anthropic = ["dep:reqwest"]
deepseek = ["dep:reqwest"]
kimi = ["dep:reqwest"]
qwen = ["dep:reqwest"]
grok = ["dep:reqwest"]
ollama = ["dep:reqwest"]
openai-compatible = ["dep:reqwest"]
gemini = ["dep:reqwest"]
mock = []
vision = ["openai", "dep:base64"]
openai-embeddings = ["openai"]

[dependencies]
paladin-core = { package = "paladin-ai-core", version = "0.10.1", path = "../paladin-core" }
paladin-ports = { version = "0.10.1", path = "../paladin-ports" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# Parses the three RFC 7231 HTTP-date forms of a `Retry-After` header (PACE-01). Already in
# `Cargo.lock` (1.0.3) via hyper; promoted from transitive to a direct dependency.
httpdate = "1.0"
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"], optional = true }
# Required, not optional: the un-gated Cadence decorator (`cadence.rs`) spreads waiters released by
# one gate with a random fraction, and it must do so in every build -- including
# `--no-default-features`, where no provider feature pulls `rand` in (PACE-02, research
# Pitfall 8, option a). `rand 0.8` is already a workspace dependency; no new package.
rand = { workspace = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
mockito = "1.7.0"
# `test-util` gives the Cadence decorator's paused-clock tests (`start_paused`) -- a feature of the
# already-present tokio dependency, not a new crate.
tokio = { workspace = true, features = ["test-util"] }
# `InMemoryCadence` for the `CadenceLlmAdapter` decorator's own unit tests (PACE-02, plan 43-01).
# Dev-only on purpose: D-09 keeps paladin-llm free of any normal edge to paladin-storage (and the
# Redis client). No cycle: paladin-storage depends only on paladin-core + paladin-ports.
# Path-only, no `version =` (plan 37.1-04, same v0.10.0 release-day defect as paladin-battalion's
# dev-dependencies): paladin-llm publishes at CRATES position 5, before paladin-storage at
# position 10, so a versioned dev-dependency here is unresolvable against the live registry at
# publish time. Path-only means Cargo strips this entry from the published manifest entirely,
# imposing no ordering constraint, while local tests keep resolving it by path.
# `check-publish-order` (SC3) gates this edge.
paladin-storage = { path = "../paladin-storage" }

[[bench]]
name = "llm_serialization_benchmarks"
harness = false

# Phase 17 UAT test 4: live smoke test against the real vendor endpoints.
# Requires real credentials in the environment; never run in CI.
[[example]]
name = "live_vendor_smoke"
required-features = ["kimi", "qwen", "grok", "gemini"]
