[package]
name = "paladin-llm"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["Am0rfu5"]
license = "MIT OR Apache-2.0"
description = "LLM provider adapters for the Paladin framework — major hosted providers plus a generic OpenAI-compatible adapter for any other endpoint; see README for the full list"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "llm", "openai-compatible", "gemini", "agents"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-llm"

[lib]
doctest = false

[features]
default = ["openai", "mock"]
openai = ["dep:reqwest", "dep:rand"]
anthropic = ["dep:reqwest", "dep:rand"]
deepseek = ["dep:reqwest", "dep:rand"]
kimi = ["dep:reqwest", "dep:rand"]
qwen = ["dep:reqwest", "dep:rand"]
grok = ["dep:reqwest", "dep:rand"]
ollama = ["dep:reqwest", "dep:rand"]
openai-compatible = ["dep:reqwest", "dep:rand"]
gemini = ["dep:reqwest", "dep:rand"]
mock = []
vision = ["openai", "dep:base64"]
openai-embeddings = ["openai"]

[dependencies]
paladin-core = { package = "paladin-ai-core", version = "0.9.0", path = "../paladin-core" }
paladin-ports = { version = "0.9.0", path = "../paladin-ports" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"], optional = true }
rand = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
mockito = "1.7.0"

[[bench]]
name = "llm_serialization_benchmarks"
harness = false

# Phase 17 UAT test 4: live smoke test against the real vendor endpoints.
# Requires real credentials in the environment; never run in CI.
[[example]]
name = "live_vendor_smoke"
required-features = ["kimi", "qwen", "grok", "gemini"]
