[package]
name = "paladin-memory"
version = "0.9.0"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
license = "MIT OR Apache-2.0"
description = "Memory adapters for the Paladin framework — Garrison (conversation history) and Sanctum (vector search)"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "memory", "vector", "garrison", "sanctum"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-memory"

[lib]
doctest = false

[features]
default = []
sqlite = ["dep:sqlx"]
qdrant = ["dep:qdrant-client"]
content-processing = ["dep:tiktoken-rs"]

[dependencies]
paladin-core = { package = "paladin-ai-core", version = "0.9.0", path = "../paladin-core" }
paladin-ports = { version = "0.9.0", path = "../paladin-ports" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
sqlx = { workspace = true, optional = true }
qdrant-client = { workspace = true, optional = true }
tiktoken-rs = { version = "0.6.0", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10.1"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "sanctum_benchmarks"
harness = false

[[bench]]
name = "garrison_benchmarks"
harness = false
