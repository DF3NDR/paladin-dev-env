[package]
name = "paladin-memory"
version = "0.10.1"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
license = "MIT OR Apache-2.0"
description = "Memory adapters for the Paladin framework — Garrison (conversation history) and Sanctum (vector search)"
readme = "README.md"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "memory", "vector", "garrison", "sanctum"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-memory"

[lib]
doctest = false

[features]
default = []
sqlite = ["dep:sqlx"]
qdrant = ["dep:qdrant-client"]
content-processing = ["dep:tiktoken-rs"]

[dependencies]
paladin-core = { package = "paladin-ai-core", version = "0.10.1", path = "../paladin-core" }
paladin-ports = { version = "0.10.1", path = "../paladin-ports" }
# The first UNCONDITIONAL PRODUCTION lateral adapter->adapter edge in the workspace
# (Phase 33, D-01): paladin-battalion takes paladin-llm as a dev-dependency only and
# paladin-content takes it optionally behind its `llm` feature, so this is a new kind
# of commitment, not a repeat of an existing one. No cycle: paladin-llm depends only
# on paladin-core and paladin-ports. `default-features = false` keeps reqwest/rand out
# of this crate -- `commissary` and `window` are unconditional modules in paladin-llm,
# so a featureless build is enough for RagRetrievalService's Commissary::dispense call.
paladin-llm = { version = "0.10.1", path = "../paladin-llm", default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
sqlx = { workspace = true, optional = true }
qdrant-client = { workspace = true, optional = true }
tiktoken-rs = { version = "0.6.0", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10.1"
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = "1.4"

[[bench]]
name = "sanctum_benchmarks"
harness = false

[[bench]]
name = "garrison_benchmarks"
harness = false
