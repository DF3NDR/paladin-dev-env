[package]
name = "paladin-notifications"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["Am0rfu5"]
description = "Notification adapter implementations for the Paladin framework (email, push, system)"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "notifications", "email", "push", "system"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-notifications"

[lib]
doctest = false

[features]
email  = ["dep:lettre", "dep:handlebars"]
push   = []
system = []

[dependencies]
paladin-core  = { package = "paladin-ai-core", version = "0.9.0", path = "../paladin-core" }
paladin-ports = { version = "0.9.0", path = "../paladin-ports" }
async-trait   = { workspace = true }
chrono        = { workspace = true }
serde         = { workspace = true }
thiserror     = { workspace = true }
uuid          = { workspace = true }
tokio        = { workspace = true }
serde_json   = { workspace = true }
lettre = { version = "0.11.17", features = ["smtp-transport", "pool", "hostname", "builder"], optional = true }
handlebars = { version = "6.3.2", optional = true }
