[package]
name = "paladin-ports"
version = "0.10.0"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
description = "Port trait definitions (hexagonal architecture contracts) for the Paladin framework"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "agents", "hexagonal", "ports", "traits"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-ports"

[dependencies]
paladin_core = { package = "paladin-ai-core", version = "=0.10.0", path = "../paladin-core" }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
log = { workspace = true }
md5 = "0.7"
mime_guess = "2"

# X-10.6 deliberate-breaking suppression (D-04, MIGRATION.md §9.2, FT-01/FT-05, Phase 25).
# `LlmError` gained the `ProviderError` and `AllProvidersFailed` variants
# (status-carrying, for the FT-05 fallback chain, D-03) and a new
# `transience()` method; marked `#[non_exhaustive]` so the provider-error
# taxonomy can grow without a semver-major bump. Register/remove this
# suppression only in the same commit as the matching MIGRATION.md §9.2 row
# and `.cargo/semver-checks-allowlist.toml` entry (kept set-equal by CI's
# `semver` job).
#
# X-10.6 deliberate-breaking suppression (D-28, MIGRATION.md §9.2, RT-05, Phase 26).
# `LlmRequest` gained the additive `response_format: Option<ResponseFormat>` field
# and is marked `#[non_exhaustive]` -- it has no `Default`, so there is no
# functional-update site to preserve, and only marking it non-exhaustive keeps the
# *next* field free. Register/remove this suppression only in the same commit as
# the matching MIGRATION.md §9.2 row and `.cargo/semver-checks-allowlist.toml`
# entry (kept set-equal by CI's `semver` job).
[package.metadata.cargo-semver-checks.lints]
enum_marked_non_exhaustive = "allow"
struct_marked_non_exhaustive = "allow"
