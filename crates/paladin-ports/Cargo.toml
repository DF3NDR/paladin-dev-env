[package]
name = "paladin-ports"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
authors = ["Am0rfu5"]
description = "Port trait definitions (hexagonal architecture contracts) for the Paladin framework"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "agents", "hexagonal", "ports", "traits"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-ports"

[dependencies]
paladin_core = { package = "paladin-ai-core", version = "=0.9.0", path = "../paladin-core" }
async-trait = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
futures = "0.3"
md5 = "0.7"
mime_guess = "2"
