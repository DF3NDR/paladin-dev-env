[package]
name = "paladin-storage"
version = "0.9.0"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
description = "SQL-backed repository adapters for the Paladin framework (SQLite and MySQL)"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "storage", "sqlite", "mysql", "sqlx"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-storage"

[lib]
doctest = false

[features]
## Enable the SQLite repository adapters.
sqlite = ["dep:sqlx", "sqlx/sqlite"]
## Enable the MySQL repository adapters.
mysql = ["dep:sqlx", "sqlx/mysql"]
## Enable the PostgreSQL `WaypointPort` adapter (ENG-05, D-01). `sqlx/postgres`
## on the already-pinned `sqlx 0.8` -- no new crate name.
postgres = ["dep:sqlx", "sqlx/postgres"]
## Enable the MinIO / S3 file-storage adapter.
s3 = ["dep:rust-s3"]
## Enable the Redis queue adapter.
redis-queue = ["dep:redis"]
## Enable the Redis-backed `NodeCachePort` adapter (Doc 04 FT-FR-18…20, D-27).
## Shares the already-declared optional `redis` dependency with
## `redis-queue` -- no new dependency name, no version bump.
redis-cache = ["dep:redis"]
## Enable the tokio-cron-scheduler-backed SchedulerPort adapter.
scheduler = ["dep:tokio-cron-scheduler"]

[dependencies]
paladin-core = { package = "paladin-ai-core", version = "0.9.0", path = "../paladin-core" }
paladin-ports = { version = "0.9.0", path = "../paladin-ports" }

async-trait = { workspace = true }
chrono     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
uuid       = { workspace = true }
tokio      = { workspace = true }

# croner/chrono-tz back `cron.rs`'s cron parsing (D-38) -- always compiled,
# no feature gate, since `run_schedule`'s InMemory adapter needs them with
# no `sqlite`/`postgres` feature enabled. Pinned to the same workspace
# versions promoted in root Cargo.toml.
croner     = { workspace = true }
chrono-tz  = { workspace = true }

# sqlx is optional: activated by the sqlite or mysql feature.
sqlx = { workspace = true, optional = true }

# rust-s3 is optional: activated by the s3 feature (MinIO/S3 file storage).
rust-s3 = { version = "0.35.1", optional = true }

# redis is optional: activated by the redis-queue or redis-cache feature.
# `safe_iterators` is required by the redis-cache adapter's `scan_match`-based
# `invalidate` (T-25-17): without it, `redis::AsyncIter` silently stops at the
# first value that fails conversion rather than surfacing the error.
redis = { version = "0.32.2", features = ["aio", "tokio-comp", "connection-manager", "script", "safe_iterators"], optional = true }

# tokio-cron-scheduler is optional: activated by the scheduler feature. Pinned
# to the same "0.13" the workspace root already resolves.
tokio-cron-scheduler = { version = "0.13", optional = true }

# url is used for parsing source URLs stored in content rows.
url = "2"

[dev-dependencies]
# tempfile is used by SqliteRunRepository's on-disk (not sqlite::memory:)
# multi-thread stress test (D-52) -- pinned to the same "3.10.1" the
# workspace root and paladin-memory already resolve.
tempfile = "3.10.1"
