[package]
name = "paladin-web"
version = "0.9.0"
edition = "2024"
rust-version.workspace = true
authors = ["Am0rfu5"]
description = "Web server adapters for the Paladin AI orchestration framework (axum)"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DF3NDR/paladin-dev-env"
keywords = ["ai", "web", "axum", "http", "orchestration"]
categories = ["development-tools", "asynchronous", "api-bindings"]
documentation = "https://docs.rs/paladin-web"

[dependencies]
paladin-ports = { version = "0.9.0", path = "../paladin-ports" }
paladin-core = { package = "paladin-ai-core", version = "0.9.0", path = "../paladin-core" }
axum = { version = "0.8.4" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
log = { workspace = true }
async-trait = { workspace = true }
# Streaming (SSE): build the axum SSE body from the agent PaladinStream with a deadline.
futures = "0.3"
async-stream = "0.3"
# Cross-cutting HTTP layers (Epic 4): CORS, body-size limit, global timeout, rate limiting.
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "timeout"] }
tower_governor = { version = "0.8", features = ["axum"] }
# OpenAPI spec + interactive docs (Epic 6): derive the spec from DTOs/handlers, serve Swagger UI.
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
mockito = "1.7.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# X-10.6 deliberate-breaking suppression (D-06, MIGRATION.md §9.2, HITL-05, Phase 24).
# `require_authentication` (agent_auth.rs) gained a generic type parameter `S:
# HasAgentAuth` so `ThreadApiState`'s routes (24-11) could reuse the SAME
# middleware `AgentApiState`'s routes already layer, instead of a duplicated
# copy. This is a real, intentional generic-arity break for any external
# caller using turbofish syntax against the old zero-generic signature.
# Register/remove this suppression only in the same commit as the matching
# MIGRATION.md §9.2 row and `.cargo/semver-checks-allowlist.toml` entry (kept
# set-equal by CI's `semver` job).
[package.metadata.cargo-semver-checks.lints]
function_requires_different_generic_type_params = "allow"
