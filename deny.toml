# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/
#
# Enforces dependency license compliance, bans, duplicate-version detection, and
# advisory checks across the Paladin workspace dependency graph.
#
# Run locally with:  cargo deny check
# (or `make security` to run cargo-audit + cargo-deny together)

# ---------------------------------------------------------------------------
# Graph: which parts of the dependency tree to consider.
# ---------------------------------------------------------------------------
[graph]
# Check the dependency graph for all target triples (don't filter by host).
all-features = true

# ---------------------------------------------------------------------------
# Licenses: enforce a permissive-only allow-list (Milestone 10 Epic 2 FR 11).
# Copyleft licenses (GPL-*, AGPL-*, LGPL-*) are intentionally NOT allowed.
# Add a specific SPDX id here (with justification) only if a required crate
# uses a license outside this set.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # Unicode-3.0: the Unicode License v3 is a permissive, MIT-equivalent license
    # (no copyleft). Used by the `icu_*`, `unicode-ident`, `zerovec`, `yoke`,
    # `tinystr`, etc. crates pulled transitively via `idna`/`url`. Added per
    # Epic 2 FR 14(a) with justification.
    "Unicode-3.0",
    # 0BSD: the "zero-clause BSD" / public-domain-equivalent license (permissive,
    # no attribution requirement). Used by `quoted_printable`. Non-copyleft.
    "0BSD",
    # CC0-1.0: public-domain dedication (permissive, no copyleft). Used by
    # `tiny-keccak` (and dual-licensed in `blake3`/`constant_time_eq`).
    "CC0-1.0",
    # CDLA-Permissive-2.0: Community Data License Agreement – Permissive 2.0,
    # a permissive (non-copyleft) data license used by `webpki-roots` for the
    # bundled Mozilla CA certificate set.
    "CDLA-Permissive-2.0",
]
# Minimum confidence the license detector must have before accepting a match.
confidence-threshold = 0.8

# Per-crate license exceptions (Epic 2 FR 14(b)): MPL-2.0 is a *weak*, file-level
# copyleft license — its obligations apply only to modifications of the MPL crate's
# own source files and impose no copyleft on the larger work that merely depends on
# it. To keep the global allow-list permissive-only, MPL-2.0 is NOT added there;
# instead each MPL crate in the tree is granted a narrowly-scoped exception below.
[[licenses.exceptions]]
crate = "colored" # MPL-2.0
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "attohttpc" # MPL-2.0
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "cssparser" # MPL-2.0 (Servo)
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "cssparser-macros" # MPL-2.0 (Servo)
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "dtoa-short" # MPL-2.0
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "minidom" # MPL-2.0
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "selectors" # MPL-2.0 (Servo)
allow = ["MPL-2.0"]
[[licenses.exceptions]]
crate = "smartstring" # MPL-2.0+
allow = ["MPL-2.0"]

# Per-crate clarifications for crates whose license metadata is ambiguous or
# expressed only in a license file. Add entries here (with a comment) instead of
# weakening the global allow-list.
# Example:
# [[licenses.clarify]]
# crate = "some-crate"
# expression = "MIT"
# license-files = [{ path = "LICENSE", hash = 0x00000000 }]

# ---------------------------------------------------------------------------
# Bans: ban specific crates and surface duplicate versions.
# Start with no banned crates; add as needed. Duplicate versions are a warning
# (not an error) since most duplicates come from transitive deps we don't
# control (FR 12 / Open Question 4).
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "warn"
# Banned crates. Add { crate = "name", reason = "..." } entries here as needed.
deny = [
    # paladin-web standardizes on axum; a second HTTP framework is not allowed
    # (Milestone 8 Epic 7). Reintroducing actix-web must be a deliberate, reviewed decision.
    { crate = "actix-web", reason = "paladin-web standardizes on axum; no second web framework" },
]

# ---------------------------------------------------------------------------
# Advisories: RustSec advisory database checks. `SECURITY-EXCEPTIONS.md` (repo
# root) is the authoritative GOVERNANCE register for every entry below — owner,
# review date, affected scope and compensating control for each. This file and
# `.cargo/audit.toml` are mechanical mirrors of that register, not independent
# sources of truth; `scripts/check-advisory-register.sh` enforces the
# agreement (see ADR-0024). The vulnerability class below is mirrored exactly
# from `.cargo/audit.toml`; the unmaintained class is cargo-deny-only, per
# ADR-0024 decision 1.
# ---------------------------------------------------------------------------
[advisories]
ignore = [
    # --- Vulnerability advisories (mirrored from .cargo/audit.toml; see SECURITY-EXCEPTIONS.md) ---
    "RUSTSEC-2023-0071", # rsa (timing side-channel) — transitive dev/test dep of sqlx-mysql
    "RUSTSEC-2025-0111", # tokio-tar (path-traversal) — transitive dev/test dep of testcontainers
    "RUSTSEC-2026-0187", # lopdf (stack-overflow) — transitive via pdf-extract (paladin-content)
    "RUSTSEC-2026-0194", # quick-xml (quadratic attr parsing DoS) — transitive via rust-s3/aws-creds (optional s3)
    "RUSTSEC-2026-0195", # quick-xml (namespace-alloc DoS) — transitive via rust-s3/aws-creds (optional s3)
    "RUSTSEC-2026-0367", # zip (SUID/SGID bits on extract) — build-dependency of utoipa-swagger-ui (paladin-web), build time only
    "RUSTSEC-2026-0368", # zip (symlink target outside destination) — build-dependency of utoipa-swagger-ui (paladin-web), build time only
    "RUSTSEC-2026-0369", # zip (permissions through symlinks) — build-dependency of utoipa-swagger-ui (paladin-web), build time only

    # --- Unmaintained advisories (cargo-deny only; cargo-audit does not gate on these; see SECURITY-EXCEPTIONS.md) ---
    "RUSTSEC-2021-0141", # dotenv (unmaintained) — local .env file loading; replace with dotenvy later
    "RUSTSEC-2025-0057", # fxhash (unmaintained) — transitive via selectors/scraper (optional web-scraping)
    "RUSTSEC-2025-0119", # number_prefix (unmaintained) — transitive via indicatif (CLI progress-bar formatting)
    "RUSTSEC-2025-0134", # rustls-pemfile (unmaintained) — transitive via tonic/testcontainers (dev/test PEM parsing)
    "RUSTSEC-2024-0436", # paste (unmaintained) — transitive via utoipa (paladin-web OpenAPI generation)
    "RUSTSEC-2026-0249", # smartstring (unmaintained) — transitive via rxml/minidom under rust-s3's optional s3 feature
    "RUSTSEC-2024-0449", # unsafe-libyaml (unmaintained) — transitive via serde_yaml 0.9 (paladin-eval, optional cli feature); migrate to serde-saphyr later
]

# ---------------------------------------------------------------------------
# Sources: restrict where crates may be fetched from. Only crates.io is allowed
# by default; add explicit allow-lists here if git/registry sources are needed.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "warn"
unknown-git = "warn"
