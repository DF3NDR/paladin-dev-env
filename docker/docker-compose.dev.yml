services:
  redis:
    command: redis-server --appendonly yes --save 60 1 --loglevel debug
    volumes:
      - ./redis-dev.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"

  # Inherits the pinned image from docker-compose.yml (no image line here).
  rustfs:
    environment:
      RUSTFS_ACCESS_KEY: devuser
      RUSTFS_SECRET_KEY: devpassword123
    ports:
      - "9000:9000"
      - "9001:9001"

  paladin-app:
    build:
      target: development
    volumes:
      - ../target:/app/target
      - ../src:/app/src:ro
      - ../Cargo.toml:/app/Cargo.toml:ro
      - ../Cargo.lock:/app/Cargo.lock:ro
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
      - APP_ENV=development
      - APP_MINIO_ACCESS_KEY=devuser
      - APP_MINIO_SECRET_KEY=devpassword123
    command: cargo run
