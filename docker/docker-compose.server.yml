# Run the Paladin HTTP API server (`paladin-server`) standalone.
#
# Epics 1–6 agents are LLM + prompt only (no garrison/arsenal), so no backing services
# are required. First run:
#
#   1. cp config.example.yml config.yml   (at the repository root; `config.yml` is gitignored)
#      and paste a literal key into `http.auth.api_keys`. The server does not expand
#      `${VAR}` there, and a key containing `${` is refused at boot.
#   2. OPENAI_API_KEY=sk-...  docker compose -f docker/docker-compose.server.yml up --build
#   3. curl localhost:8080/health • open http://localhost:8080/docs
services:
  paladin-server:
    build:
      context: ..
      dockerfile: Dockerfile.server
    image: paladin-server:latest
    ports:
      - "8080:8080"
    environment:
      - PALADIN_CONFIG=/etc/paladin/config.yml
      # The provider key is the only secret passed through the environment (never baked
      # into the image; unset falls back to empty). The HTTP API keys live in the mounted
      # `config.yml`, not here.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    # The mounted file replaces the baked default (`config.example.yml`), which configures
    # no API key, so the server refuses to start without it.
    volumes:
      - ../config.yml:/etc/paladin/config.yml:ro
    restart: unless-stopped
