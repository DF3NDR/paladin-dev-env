services:
  redis-test:
    image: redis:7-alpine
    container_name: paladin-redis-test
    ports:
      - "6380:6379"
    command: redis-server --appendonly no --save "" --protected-mode no
    tmpfs:
      - /data
    networks:
      - paladin-test-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-test:
    image: minio/minio:latest
    container_name: paladin-minio-test
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpass123
      MINIO_CONSOLE_ADDRESS: ":9001"
    command: server /data --console-address ":9001"
    tmpfs:
      - /data
    networks:
      - paladin-test-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio-test-init:
    image: minio/mc:latest
    container_name: paladin-minio-test-init
    depends_on:
      minio-test:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpass123
    entrypoint: |
      /bin/sh -c "
      echo 'Waiting for MinIO test to be ready...'
      until mc alias set minio http://minio-test:9000 \$$MINIO_ROOT_USER \$$MINIO_ROOT_PASSWORD; do
        echo 'MinIO test not ready, waiting...'
        sleep 2
      done
      echo 'MinIO test is ready. Creating test buckets...'
      mc mb minio/test-bucket --ignore-existing
      mc mb minio/integration-tests --ignore-existing
      echo 'Test bucket initialization complete'
      "
    networks:
      - paladin-test-network

  # Ollama Tier 2 suite (17-07, D-15): the phase's only end-to-end exercise of
  # the shared CompatEngine against a real implementation of the
  # OpenAI-compatible protocol, requiring no credential. Mapped host port
  # 11435 avoids colliding with a locally-running Ollama instance on the
  # default 11434.
  ollama-test:
    image: ollama/ollama:0.3.14
    container_name: paladin-ollama-test
    ports:
      - "11435:11434"
    tmpfs:
      - /root/.ollama
    networks:
      - paladin-test-network
    healthcheck:
      # `ollama list` calls the server's own local API internally and only
      # succeeds once the server is actually serving requests, so it proves
      # readiness without depending on curl/wget being present in the base
      # image (unverified without Docker in this sandbox -- see
      # 17-07-SUMMARY.md verification-debt note). It exercises the native
      # /api/tags surface rather than the OpenAI-compat /v1/models surface
      # that tests/integration/ollama_docker_test.rs itself calls; that is a
      # deliberate, documented substitution, not an oversight.
      test: [ "CMD", "ollama", "list" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Pulls one small model once ollama-test is healthy. qwen2.5:0.5b is the
  # smallest instruction-tuned model in the qwen2.5 family (~397MB) capable
  # of producing a real chat completion -- chosen over a base or
  # embedding-only model so the suite's generate()/generate_stream() round
  # trips exercise a genuine chat-completion response, not just a
  # healthcheck ping. A future increase in model size is a visible edit
  # here, not a silent drift in CI wall time (T-17-38).
  ollama-test-init:
    image: ollama/ollama:0.3.14
    container_name: paladin-ollama-test-init
    depends_on:
      ollama-test:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama-test:11434"
    entrypoint: |
      /bin/sh -c "
      echo 'Pulling qwen2.5:0.5b onto ollama-test...'
      ollama pull qwen2.5:0.5b
      echo 'Model pull complete'
      "
    networks:
      - paladin-test-network

  # PostgreSQL Tier 2 suite (Phase 22 Plan 22-06, D-10): the only place in
  # the workspace `PostgresWaypointStore` runs against a real Postgres
  # server, proving the shared WaypointPort contract suite (from Plan 22-03)
  # passes unchanged across all three backends. Mapped host port 5433 avoids
  # colliding with a locally-running Postgres instance on the default 5432.
  # Credentials are scoped to this test compose file only -- never used
  # outside a throwaway, tmpfs-backed container.
  postgres-test:
    image: postgres:16-alpine
    container_name: paladin-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: paladin
      POSTGRES_PASSWORD: paladin
      POSTGRES_DB: paladin_waypoint_test
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - paladin-test-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U paladin -d paladin_waypoint_test" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Service for running integration tests
  integration-tests:
    build:
      context: ..
      dockerfile: docker/testserver/Dockerfile
      target: test
    container_name: paladin-integration-tests
    depends_on:
      minio-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      minio-test-init:
        condition: service_completed_successfully
    environment:
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
      - APP_REDIS_HOST=redis-test
      - APP_REDIS_PORT=6379
      - APP_MINIO_ENDPOINT=minio-test:9000
      - APP_MINIO_ACCESS_KEY=testuser
      - APP_MINIO_SECRET_KEY=testpass123
      - APP_MINIO_BUCKET=test-bucket
      - APP_MINIO_SECURE=false
    command: cargo test --features integration-tests -- --test-threads=1 --nocapture
    networks:
      - paladin-test-network

networks:
  paladin-test-network:
    driver: bridge
