services:
  redis:
    image: redis:7-alpine
    container_name: paladin-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    environment:
      - REDIS_REPLICATION_MODE=master
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "--no-auth-warning", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - paladin-network
    restart: unless-stopped

  # S3-compatible object store (RustFS), pinned to an exact tag (Phase 45 D-03).
  # Manifest-list digest for the pinned tag:
  # sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
  # A re-pin is a deliberate commit, never automatic.
  # No `command:` key: the image entrypoint appends /data itself. No bucket-init
  # service either: `MinioAdapter::new` creates the bucket it needs (D-05).
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: paladin-rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-paladin-dev}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-paladin-dev-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health/ready" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - paladin-network
    restart: unless-stopped

  paladin-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: paladin-app
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      # Redis configuration
      - APP_REDIS_HOST=redis
      - APP_REDIS_PORT=6379
      - APP_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - APP_REDIS_DB=0
      - APP_REDIS_CONNECTION_TIMEOUT=30
      - APP_REDIS_KEY_PREFIX=paladin:queue
      - APP_REDIS_MAX_RETRIES=3
      - APP_REDIS_ENABLE_PRIORITY_QUEUES=true

      # S3-compatible object store configuration (RustFS; the application-side
      # names keep the MinIO prefix, Phase 45 D-04)
      - APP_MINIO_ENDPOINT=rustfs:9000
      - APP_MINIO_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-paladin-dev}
      - APP_MINIO_SECRET_KEY=${RUSTFS_SECRET_KEY:-paladin-dev-secret}
      - APP_MINIO_BUCKET=paladin-files
      - APP_MINIO_SECURE=false
      - APP_MINIO_PATH_STYLE=true
      - APP_MINIO_CONNECTION_TIMEOUT=30
      - APP_MINIO_REQUEST_TIMEOUT=300
      - APP_MINIO_MAX_IDLE_CONNS=10
      - APP_MINIO_MAX_FILE_SIZE=104857600 # 100MB
      - APP_MINIO_ALLOWED_EXTENSIONS=txt,md,json,pdf,doc,docx,jpg,png,gif,rs,py,js,html,css,xml

      # Application configuration
      - APP_SERVER_HOST=0.0.0.0
      - APP_SERVER_PORT=8080
      - APP_LLM_TYPE=${LLM_TYPE:-openai}
      - APP_LLM_URL=${LLM_URL:-https://api.openai.com/v1}
      - APP_LLM_API_KEY=${LLM_API_KEY}
      - APP_MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}

      # Message service configuration
      - MESSAGE_SERVICE_MAX_QUEUE_SIZE=10000
      - MESSAGE_SERVICE_WORKER_THREADS=4
      - MESSAGE_SERVICE_ENABLE_PERSISTENCE=true
      - MESSAGE_SERVICE_DEFAULT_TTL_SECONDS=3600
      - MESSAGE_SERVICE_RETRY_ATTEMPTS=3
      - MESSAGE_SERVICE_RETRY_DELAY_MS=1000

      # Logging
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-0}
    volumes:
      - app_data:/app/data
      - ./config:/app/config:ro
    networks:
      - paladin-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: paladin-redis-commander
    ports:
      - "8081:8081"
    depends_on:
      - redis
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-}
      - HTTP_USER=${REDIS_COMMANDER_USER:-admin}
      - HTTP_PASSWORD=${REDIS_COMMANDER_PASSWORD:-admin}
    networks:
      - paladin-network
    restart: unless-stopped
    profiles:
      - dev
      - debug

  # Optional: Redis Insight for advanced Redis monitoring
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: paladin-redis-insight
    ports:
      - "8001:8001"
    depends_on:
      - redis
    volumes:
      - redis_insight_data:/db
    networks:
      - paladin-network
    restart: unless-stopped
    profiles:
      - dev
      - debug

  qdrant:
    image: qdrant/qdrant:latest
    container_name: paladin-qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - paladin-network
    restart: unless-stopped
    profiles:
      - dev
      - test

volumes:
  redis_data:
    driver: local
  rustfs_data:
    driver: local
  app_data:
    driver: local
  redis_insight_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  paladin-network:
    driver: bridge
