# ============================================================================
# BASIC PALADIN CONFIGURATION EXAMPLE
# ============================================================================
# This is the simplest possible Paladin configuration for getting started.
# For use with: paladin agent run -c basic_paladin.yaml -i "Your question"
#
# Learn more: See docs/CLI_USAGE.md for complete documentation
# ============================================================================

# ============================================================================
# IDENTITY
# ============================================================================

# Unique name for this Paladin instance
# Used in logs and when multiple Paladins interact
name: "BasicPaladin"

# User name shown in conversation context
# The Paladin uses this when addressing you
user_name: "User"

# ============================================================================
# SYSTEM PROMPT (MOST IMPORTANT SETTING)
# ============================================================================

# This defines the Paladin's personality, capabilities, and behavior.
# Think of it as hiring instructions for your AI assistant.
# Be specific about what you want the Paladin to do!

system_prompt: |
  You are a helpful AI assistant that can answer questions and help with tasks.
  Be concise and clear in your responses.
  When asked to perform a task, break it down into steps and execute them.

# ============================================================================
# LLM CONFIGURATION
# ============================================================================

# Model selection
# - gpt-4: Most capable, higher cost (recommended for complex tasks)
# - gpt-3.5-turbo: Faster, lower cost (good for simple tasks)
# - deepseek-chat: Cost-effective alternative with good performance
model: "gpt-4o-mini"

# Temperature: Controls randomness in responses (0.0 to 1.0)
# - 0.0 = Deterministic, factual, consistent
# - 0.7 = Balanced (good default)
# - 1.0 = Creative, varied, unpredictable
temperature: 0.7

# Max loops: Maximum reasoning cycles before stopping
# - 1 = Single response (no multi-step reasoning)
# - 3 = Good default (allows some back-and-forth)
# - 5+ = Complex multi-step tasks
max_loops: 3

# Timeout: Maximum execution time in seconds
# Prevents runaway costs from infinite loops
timeout_seconds: 300

# Stop words: Phrases that immediately end execution
# Useful for controlling conversation termination
stop_words: ["TERMINATE", "STOP"]

# ============================================================================
# PROVIDER CONFIGURATION
# ============================================================================

provider:
  # Provider type: openai, deepseek, or anthropic
  type: openai

  # API key loaded from environment variable
  # Before running, set: export OPENAI_API_KEY="your-key-here"
  # Default env var name: OPENAI_API_KEY (auto-detected)

# ============================================================================
# OPTIONAL: GARRISON (MEMORY SYSTEM)
# ============================================================================

# Uncomment to enable memory/context retention across interactions

# garrison:
#   # Memory type:
#   # - in_memory: Fast but temporary (lost when process ends)
#   # - sqlite: Persistent across sessions (stored in database)
#   type: in_memory
#
#   # For persistent memory, specify database path:
#   # type: sqlite
#   # path: ./garrison.db
#   # max_entries: 1000

# ============================================================================
# OPTIONAL: ARSENAL (EXTERNAL TOOLS)
# ============================================================================

# Uncomment to give your Paladin access to external capabilities
# Requires MCP (Model Context Protocol) servers

# arsenal:
#   mcp_servers:
#     # Web search capability
#     - name: web_search
#       type: stdio
#       command: uvx
#       args:
#         - mcp-web-search
#
#     # File system access (⚠️ be careful with permissions!)
#     # - name: filesystem
#     #   type: stdio
#     #   command: npx
#     #   args:
#     #     - -y
#     #     - "@modelcontextprotocol/server-filesystem"
#     #     - /safe/directory/path

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

# Run with command-line input:
#   paladin agent run -c basic_paladin.yaml -i "What is Rust?"

# Interactive mode (prompts for input):
#   paladin agent run -c basic_paladin.yaml

# With verbose output (see reasoning process):
#   paladin agent run -c basic_paladin.yaml -i "Query" --verbose

# Save output to file:
#   paladin agent run -c basic_paladin.yaml -i "Query" -o result.json

# ============================================================================
# NEXT STEPS
# ============================================================================

# 1. Set your API key: export OPENAI_API_KEY="sk-..."
# 2. Run: paladin agent run -c basic_paladin.yaml -i "Hello!"
# 3. Experiment with different system prompts
# 4. Try advanced_paladin.yaml for garrison/arsenal features
# 5. Explore battalion configs for multi-agent workflows
