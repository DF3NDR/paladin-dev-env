# ============================================================================
# FORMATION BATTALION CONFIGURATION EXAMPLE
# ============================================================================
# Sequential execution: Output from one Paladin flows to the next in a chain.
# Perfect for multi-stage processing pipelines.
#
# For use with: paladin battalion run -c formation.yaml -i "Input text"
#
# Flow: Input → Analyzer → Summarizer → Output
# ============================================================================

# ============================================================================
# BATTALION TYPE
# ============================================================================

# Formation: Sequential execution pattern
# - Paladins execute one after another in defined order
# - Each Paladin receives previous Paladin's output as input
# - Perfect for pipelines, workflows, and multi-stage processing
type: formation

# Battalion identifier
name: "SimpleFormation"

# ============================================================================
# PALADINS (SEQUENTIAL CHAIN)
# ============================================================================

paladins:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 1: ANALYZER
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Role: Deep analysis and information extraction
  # Input: Original user input
  # Output: Structured analysis with key points and patterns

  - inline:
      name: "AnalyzerPaladin"

      system_prompt: |
        You are an expert analyzer. Your role is ANALYSIS, not summarization.

        TASK:
        Review the input and provide structured analysis including:
        1. Main topics and themes
        2. Key points and arguments
        3. Patterns or trends observed
        4. Important details and specifics
        5. Context and background

        OUTPUT FORMAT:
        Use clear sections with headings.
        Be thorough but organized.
        Extract ALL significant information.

      # Balanced temperature for analytical work
      model: "gpt-4o-mini"
      temperature: 0.7
      max_loops: 2
      timeout_seconds: 180
      stop_words: []

      provider:
        type: openai

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # STAGE 2: SUMMARIZER
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Role: Synthesize analysis into concise executive summary
  # Input: Analysis from Stage 1 (AnalyzerPaladin output)
  # Output: Concise summary with actionable insights

  - inline:
      name: "SummarizerPaladin"

      system_prompt: |
        You are an expert summarizer. You receive a detailed analysis and your
        role is to create a concise executive summary.

        TASK:
        Take the provided analysis and create:
        1. Executive Summary (2-3 sentences)
        2. Key Insights (bullet points)
        3. Actionable Recommendations (if applicable)
        4. Critical Considerations (risks, caveats, etc.)

        STYLE:
        - Be concise but comprehensive
        - Use business-appropriate language
        - Highlight most important points
        - Make it actionable

      # Lower temperature for consistent summarization
      model: "gpt-4o-mini"
      temperature: 0.5
      max_loops: 2
      timeout_seconds: 180
      stop_words: []

      provider:
        type: openai

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # OPTIONAL: ADD MORE STAGES
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # Stage 3: Validator (quality check)
  # - inline:
  #     name: "ValidatorPaladin"
  #     system_prompt: |
  #       You are a quality validator. Review the summary and check for:
  #       - Factual accuracy
  #       - Logical consistency
  #       - Completeness
  #       Provide a validation report with pass/fail and issues found.
  #     model: "gpt-4o-mini"
  #     temperature: 0.3
  #     max_loops: 1
  #     timeout_seconds: 120
  #     provider:
  #       type: openai

# ============================================================================
# FORMATION BEHAVIOR
# ============================================================================

# Pass output to next: Enable sequential data flow
# - true: Each Paladin's output becomes the next Paladin's input
# - false: All Paladins receive the original input (not recommended for formations)
pass_output_to_next: true

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

# Example 1: Analyze and summarize a document
#   paladin battalion run -c formation.yaml \
#     -i "$(cat document.txt)"

# Example 2: Process with verbose output (see each stage)
#   paladin battalion run -c formation.yaml \
#     -i "Long text to analyze" --verbose

# Example 3: Save results to file
#   paladin battalion run -c formation.yaml \
#     -i "Input text" -o analysis_results.json

# Example 4: Interactive mode
#   paladin battalion run -c formation.yaml

# ============================================================================
# WHEN TO USE FORMATIONS
# ============================================================================

# ✅ GOOD USE CASES:
# - Multi-stage text processing (analyze → summarize → validate)
# - Content generation pipelines (outline → draft → edit → polish)
# - Data transformation workflows (extract → transform → load)
# - Sequential decision making (assess → recommend → prioritize)
# - Quality improvement chains (generate → review → refine)

# ❌ NOT IDEAL FOR:
# - Independent parallel tasks (use Phalanx instead)
# - Complex branching logic (use Campaign instead)
# - Hierarchical delegation (use Chain of Command instead)

# ============================================================================
# TIPS FOR EFFECTIVE FORMATIONS
# ============================================================================

# 1. CLEAR ROLES: Each Paladin should have a distinct, specific responsibility
# 2. COMPLEMENTARY: Stages should build upon previous outputs
# 3. ORDER MATTERS: Think through the logical sequence carefully
# 4. TEMPERATURE: Lower for later stages (more refinement, less creativity)
# 5. CONTEXT: Each Paladin should know its role in the larger pipeline
