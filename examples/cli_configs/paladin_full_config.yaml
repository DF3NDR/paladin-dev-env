# ============================================================================
# CONFIGURATION BEST PRACTICES
# ============================================================================

# 1. START SIMPLE:
#    - Begin with just LLM configuration
#    - Add garrison for memory
#    - Add arsenal for specific tools you need

# 2. SECURITY:
#    - Use environment variables for API keys
#    - Limit filesystem access to specific directories
#    - Review tool capabilities before enabling

# 3. PERFORMANCE:
#    - Use in_memory garrison for development
#    - Use sqlite garrison for production
#    - Limit max_entries based on expected usage

# 4. COST OPTIMIZATION:
#    - Start with gpt-3.5-turbo for testing
#    - Use gpt-4 for production/complex reasoning
#    - Consider deepseek for cost-sensitive applications

# 5. DEBUGGING:
#    - Use --verbose flag to see all operations
#    - Check garrison database with SQLite browser
#    - Monitor tool invocations in verbose output

# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================

# Required:
#   OPENAI_API_KEY=sk-...        # For OpenAI models
#
# Optional (if using alternative providers):
#   DEEPSEEK_API_KEY=...         # For DeepSeek models
#   ANTHROPIC_API_KEY=...        # For Claude models
#   GITHUB_TOKEN=...             # For GitHub tool
#
# Development:
#   RUST_LOG=debug               # Enable debug logging
#   PALADIN_CONFIG_PATH=...      # Override config file path

# ============================================================================
# RESOURCE MANAGEMENT
# ============================================================================

# Garrison Storage:
# - SQLite database grows with usage
# - Monitor disk space for production deployments
# - Tune max_entries based on available storage
# - Consider periodic cleanup of old entries

# Arsenal Performance:
# - STDIO servers: One process per server (low overhead)
# - SSE servers: HTTP client pool (configurable)
# - Tool calls add latency to responses
# - Consider caching frequently used tool results

# LLM Usage:
# - Each max_loop iteration = 1 LLM call
# - Tool calls involve additional LLM calls for reasoning
# - Garrison context increases token usage
# - Monitor API costs in production

# ============================================================================
# TROUBLESHOOTING
# ============================================================================

# "Failed to connect to SQLite garrison":
# → Check path is writable
# → Verify parent directories exist

# "Failed to connect to MCP server":
# → Verify command/endpoint is correct
# → Check server is installed (uvx, npx)
# → For SSE, verify endpoint is accessible

# "Memory not persisting across sessions":
# → Check using sqlite (not in_memory)
# → Verify database path is consistent
# → Check file permissions

# "Tools not being used":
# → Verify tools registered (--verbose)
# → Check system prompt encourages tool use
# → Confirm max_loops > 1 for reasoning

# ============================================================================
# NEXT STEPS
# ============================================================================

# 1. Set environment variables (OPENAI_API_KEY)
# 2. Install MCP servers you want to use
# 3. Run with: paladin agent run -c paladin_full_config.yaml -i "Hello!"
# 4. Test memory: Ask something, then ask about it later
# 5. Test tools: Ask for current information requiring web search
# 6. Monitor with --verbose to understand behavior
# 7. Customize system prompt for your use case
# 8. Deploy with appropriate security measures
