# Deployment for the paladin-server HTTP API.
#
# Standalone: Milestone 12 agents are LLM + prompt only, so no Redis/MinIO is required.
# Liveness and readiness probes target the server's unauthenticated /health and /ready.
# The config is mounted from the paladin-server-secrets Secret (see secret.yaml.example).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paladin-server
  namespace: paladin
  labels:
    app: paladin-server
    version: v0.11.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: paladin-server
  template:
    metadata:
      labels:
        app: paladin-server
        version: v0.11.0
    spec:
      # 2x the default APP_ENGINE_SHUTDOWN_GRACE_SECS (30s, src/config/engine.rs)
      # so the kubelet's SIGKILL deadline never lands while paladin-server is
      # still inside its own graceful-shutdown drain window (HITL-04, D-23).
      # If you raise APP_ENGINE_SHUTDOWN_GRACE_SECS, raise this to at least
      # 2x that new value too.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: paladin-server
          image: paladin-server:0.11.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PALADIN_CONFIG
              value: /etc/paladin/config.yml
            # Provider key injected from the Secret (see secret.yaml.example); config.yml's
            # llm.openai.api_key resolves it as "${OPENAI_API_KEY}".
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: paladin-server-secrets
                  key: openai-api-key
          volumeMounts:
            - name: config
              mountPath: /etc/paladin
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        # The config holds literal API keys, so it is a Secret, not a ConfigMap. `items` projects
        # only config.yml (the provider key is not also exposed as a file); 0440 plus the pod's
        # fsGroup (65532) keeps it readable by the non-root user only.
        - name: config
          secret:
            secretName: paladin-server-secrets
            defaultMode: 0440
            items:
              - key: config.yml
                path: config.yml
