# Standalone Settings file for the `sdk-clients` CI job's smoke boot (D-49,
# PLAT-FR-17) -- NOT a partial overlay: `Settings::load_from_file` reads exactly
# one file with no merge, so every field `Settings` requires (no `#[serde(default)]`)
# must be present here, mirroring `config.test.yml`'s own required top-level shape.
#
# Deviation (recorded in 27-18-SUMMARY.md): this file is not named in 27-18-PLAN.md's
# `files_modified` frontmatter, but `scripts/sdk-smoke/run.sh` (which IS declared)
# needs some config exposing a code-registered agent and a static test API key for
# `paladin-server` to boot against -- `config.test.yml` has neither. A new,
# narrowly-scoped file colocated with the script that needs it is the minimal
# footprint that makes `run.sh` runnable.
#
# Gap-closure (27-21, D-49): this file previously pointed at the real,
# unauthenticated vendor OpenAI endpoint, so a submitted run legitimately
# failed with "Authentication failed" -- a smoke that needs a real credential
# is a smoke that cannot run on a fork's PR, and a run that ends `failed`
# proves nothing about the generated client. Both the top-level `llm_url` and
# the `llm.openai` block below now point at the loopback mock LLM stub that
# `lib-boot.sh` starts itself (`smoke_boot_start`), and `llm_api_key` is the
# same present-but-fake placeholder the boot exports as `OPENAI_API_KEY` --
# construction only checks the key is PRESENT, never that it is valid.
# Provider construction actually reads the ENVIRONMENT
# (`OpenAIConfig::from_env`), not this section, but the file stays
# self-describing so a reader does not have to cross-reference `lib-boot.sh`
# to see the endpoint a copy of this config would use.
llm_type: "openai"
llm_url: "http://127.0.0.1:18081/v1"
llm_api_key: "sk-sdk-smoke-hermetic"
max_file_size: 10485760
sources: []

server:
  host: "127.0.0.1"
  port: 18080

llm:
  default_provider: "openai"
  openai:
    api_key: "sk-sdk-smoke-hermetic"
    base_url: "http://127.0.0.1:18081/v1"

# One resident, code-registered agent (D-32) -- the id `scripts/sdk-smoke/run.sh`
# submits a run against. `allowed_roles` omitted: any authenticated caller (the
# smoke scripts' own static API key, granted `admin`) may invoke it.
agents:
  - id: "sdk-smoke-agent"
    model: "gpt-4"
    system_prompt: "You are a helpful assistant used only by the SDK smoke test."

http:
  auth:
    enabled: true
    api_keys:
      - key: "sdk-smoke-test-key"
        name: "sdk-smoke"
        role: "admin"
  docs:
    enabled: true
